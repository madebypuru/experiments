<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Mockups</title>
<style>
@font-face{font-family:'Ferry Sans';src:url('../type/fonts/FerrySans-Bold.otf');font-weight:700}
@font-face{font-family:'Ferry Sans';src:url('../type/fonts/FerrySans-Regular.otf');font-weight:400}
html,body{margin:0;background:#111}svg{display:block}
</style>
</head><body>
<div id="st"></div>
<script>
// Mockups of the Swiss-grid posters (print/swiss.html). ?m= picks the scene:
//   screens: 1 three posts in a feed, 2 a feed post and the profile grid, 3 a slide on a laptop
//   prints:  4 three posters taped to a wall, 5 loose prints on a linen table, 6 one print up close (4:5)
// The poster renders hold Pinterest-derived studies, so they live in the ignored ferry/assets/mock/posters.
// Light comes from the top left everywhere; shadows stay quiet (memory: ferry-quiet-shadows).
const Q=new URLSearchParams(location.search), M=+(Q.get('m')||1);
const P=(n,f='4x5')=>`../assets/mock/posters/ferry-${n}-${f}.jpg`;
const W=M===6?1080:1920, H=M===6?1350:1080;
const INK='#1B262B';
let uid=0;

// ---------- shared defs ----------
const DEFS=`
 <filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/>
  <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .26  0 0 0 0 .2  0 0 0 .06 0"/></filter>
 <filter id="mottle" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".0035 .005" numOctaves="4" seed="9"/>
  <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .24  0 0 0 -.9 .5"/></filter>
 <filter id="linen" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9 .03" numOctaves="2" seed="2" result="a"/>
  <feTurbulence type="fractalNoise" baseFrequency=".03 .9" numOctaves="2" seed="5" result="b"/>
  <feComposite in="a" in2="b" operator="arithmetic" k2=".5" k3=".5"/>
  <feColorMatrix values="0 0 0 0 .32  0 0 0 0 .27  0 0 0 0 .2  1.1 0 0 0 -.45"/></filter>
 <!-- a loose sheet or a device on a surface: contact + soft ambient, light top-left, a faint light rim on the lit edge -->
 <filter id="shLoose" x="-10%" y="-10%" width="125%" height="125%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="c"/><feOffset in="c" dx="1.2" dy="1.6" result="co"/>
  <feComponentTransfer in="co" result="contact"><feFuncA type="linear" slope=".2"/></feComponentTransfer>
  <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="a"/><feOffset in="a" dx="10" dy="15" result="ao"/>
  <feComponentTransfer in="ao" result="amb"><feFuncA type="linear" slope=".15"/></feComponentTransfer>
  <feFlood flood-color="#1A1C14"/><feComposite in2="amb" operator="in" result="ambC"/>
  <feFlood flood-color="#1A1C14"/><feComposite in2="contact" operator="in" result="contactC"/>
  <feOffset in="SourceAlpha" dx="1.6" dy="2" result="sh"/><feComposite in="SourceAlpha" in2="sh" operator="out" result="rim"/>
  <feGaussianBlur in="rim" stdDeviation=".7" result="rimS"/>
  <feFlood flood-color="#FFFDF7" flood-opacity=".6"/><feComposite in2="rimS" operator="in" result="rimC"/>
  <feMerge><feMergeNode in="ambC"/><feMergeNode in="contactC"/><feMergeNode in="SourceGraphic"/><feMergeNode in="rimC"/></feMerge></filter>
 <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
 <!-- masking tape: a slightly ragged, translucent strip -->
 <filter id="tape" x="-10%" y="-30%" width="120%" height="160%">
  <feTurbulence type="fractalNoise" baseFrequency=".25" numOctaves="2" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
 <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
  <stop offset="1" stop-color="#000" stop-opacity=".07"/></linearGradient>
 <linearGradient id="curl" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity="0"/>
  <stop offset="1" stop-color="#000" stop-opacity=".06"/></linearGradient>
 <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#D9DBDC"/><stop offset=".45" stop-color="#C3C6C8"/><stop offset="1" stop-color="#8E9396"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>`;

const ground=(fill)=>`<rect width="${W}" height="${H}" fill="${fill}"/><rect width="${W}" height="${H}" filter="url(#mottle)" opacity=".5"/><rect width="${W}" height="${H}" filter="url(#grain)"/>`;

// ---------- screens ----------
const UI=`-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif`;
const t=(x,y,s,w,txt,fill=INK,extra='')=>`<text x="${x}" y="${y}" fill="${fill}" style="font:${w} ${s}px ${UI}" ${extra}>${txt}</text>`;
let MARKP='';
const avatar=(cx,cy,r)=>{const id='av'+(uid++), k=r*1.15/165;return `<defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="#F2EEE6"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#D6D1C6" stroke-width="1"/>
  <g fill="${INK}" transform="translate(${cx-82.5*k} ${cy-71.5*k}) scale(${k})">${MARKP}</g>`;};
// line icons, 24 px boxes
const ic={
 heart:(x,y)=>`<path transform="translate(${x} ${y})" d="M12 20.5s-7.5-4.6-7.5-10.1A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1z" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`,
 bubble:(x,y)=>`<path transform="translate(${x} ${y})" d="M20 11.6a8 8 0 1 1-3.4-6.5A8 8 0 0 1 20 11.6zM20 11.6l1 7.4-6.2-2.3" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`,
 send:(x,y)=>`<path transform="translate(${x} ${y})" d="M21 3.5 10.4 13.9M21 3.5l-6.6 17-4-6.6-6.9-3.9z" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`,
 save:(x,y)=>`<path transform="translate(${x} ${y})" d="M6 3.5h12v17l-6-5-6 5z" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`,
 dots:(x,y)=>`<g fill="${INK}" transform="translate(${x} ${y})"><circle cx="4" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="20" cy="12" r="1.7"/></g>`,
 grid:(x,y)=>`<g transform="translate(${x} ${y})" fill="none" stroke="${INK}" stroke-width="1.7"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></g>`,
};
// the phone: 400 x 866 body; screen 372 x 838 at (14,14)
const PW=400, PHh=866, SX=14, SY=14, SW=PW-28, SH=PHh-28;
function phone(x,y,screen,scale=1){const id='ph'+(uid++);
  return `<g transform="translate(${x} ${y}) scale(${scale})">
  <g filter="url(#shLoose)"><rect width="${PW}" height="${PHh}" rx="66" fill="#23292C"/></g>
  <rect x=".75" y=".75" width="${PW-1.5}" height="${PHh-1.5}" rx="65.5" fill="none" stroke="#6C7579" stroke-width="1.5"/>
  <rect x="5" y="5" width="${PW-10}" height="${PHh-10}" rx="61" fill="#0C0F10"/>
  <defs><clipPath id="${id}"><rect x="${SX}" y="${SY}" width="${SW}" height="${SH}" rx="53"/></clipPath></defs>
  <g clip-path="url(#${id})"><rect x="${SX}" y="${SY}" width="${SW}" height="${SH}" fill="#FFFFFF"/>
   <g transform="translate(${SX} ${SY})">${statusBar()}${screen}</g>
   <rect x="${SX}" y="${SY}" width="${SW}" height="${SH}" fill="url(#glass)"/></g>
  <rect x="${PW/2-56}" y="${SY+12}" width="112" height="33" rx="16.5" fill="#050607"/>
  </g>`;}
const statusBar=()=>`${t(44,37,16,600,'9:41')}
  <g transform="translate(${SW-102} 25)" fill="${INK}"><rect x="0" y="8" width="3.5" height="5" rx="1"/><rect x="5.5" y="6" width="3.5" height="7" rx="1"/><rect x="11" y="3.5" width="3.5" height="9.5" rx="1"/><rect x="16.5" y="1" width="3.5" height="12" rx="1"/>
  <path d="M33 5.2a10 10 0 0 1 13.4 0M35.4 8.2a6.3 6.3 0 0 1 8.6 0M37.9 11a2.6 2.6 0 0 1 3.6 0" fill="none" stroke="${INK}" stroke-width="1.9" stroke-linecap="round"/>
  <rect x="53.5" y="1" width="25" height="12" rx="3.5" fill="none" stroke="${INK}" stroke-opacity=".4" stroke-width="1"/><rect x="55.5" y="3" width="19" height="8" rx="2"/><rect x="79.5" y="5" width="1.6" height="4" rx=".8" fill-opacity=".45"/></g>`;
// a feed post screen: header, the 4:5 post, actions, caption, the next post starting
function feed(n,likes,cap,next=3){const iw=SW, ih=iw*5/4, y0=118;
  return `${t(20,88,24,700,'ferry','#111',`style="font:700 24px ${UI};letter-spacing:-.4px"`)}
  <line x1="0" y1="104" x2="${SW}" y2="104" stroke="#000" stroke-opacity=".08"/>
  ${avatar(34,y0+24,17)}${t(60,y0+20,14,600,'ferry')}${t(60,y0+37,12.5,400,'Safe passage between chains','#555')}${ic.dots(SW-40,y0+12)}
  <image href="${P(n)}" x="0" y="${y0+52}" width="${iw}" height="${ih}" preserveAspectRatio="none"/>
  ${ic.heart(14,y0+62+ih)}${ic.bubble(54,y0+62+ih)}${ic.send(94,y0+62+ih)}${ic.save(SW-38,y0+62+ih)}
  ${t(16,y0+112+ih,14,600,`${likes} likes`)}
  <text x="16" y="${y0+134+ih}" style="font:400 14px ${UI}" fill="${INK}"><tspan font-weight="600">ferry</tspan> ${cap}</text>
  ${t(16,y0+156+ih,13,400,'2 hours ago','#8A8F91')}
  ${avatar(34,y0+190+ih,17)}${t(60,y0+194+ih,14,600,'ferry')}
  <image href="${P(next)}" x="0" y="${y0+222+ih}" width="${iw}" height="${ih}" preserveAspectRatio="none"/>${tabBar()}`;}
const tabBar=()=>`<rect x="0" y="${SH-84}" width="${SW}" height="84" fill="#fff"/><line x1="0" y1="${SH-84}" x2="${SW}" y2="${SH-84}" stroke="#000" stroke-opacity=".08"/>
  <g fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round" transform="translate(0 ${SH-72})">
   <path d="M30 11.5 42 3l12 8.5V24H46v-7h-8v7h-8z"/><circle cx="117" cy="12" r="7.5"/><path d="M122.5 17.5 128 23"/>
   <rect x="173" y="2" width="22" height="22" rx="6"/><path d="M184 8v10M179 13h10"/>
   <rect x="249" y="2" width="22" height="22" rx="6"/><path d="M257 9.5v7l6-3.5z" fill="${INK}"/></g>
  ${avatar(342,SH-59,12)}<rect x="${SW/2-67}" y="${SH-13}" width="134" height="5" rx="2.5" fill="#111"/>`;
// the profile grid: 3 columns of 4:5 tiles
function profile(order){const tw=(SW-4)/3, th=tw*5/4, gy=330;
  return `${t(SW/2,88,17,700,'ferry','#111','text-anchor="middle"')}
  ${avatar(62,160,44)}
  <g text-anchor="middle">${t(170,156,17,700,'6')}${t(170,176,13,400,'posts')}${t(250,156,17,700,'2,418')}${t(250,176,13,400,'followers')}${t(330,156,17,700,'12')}${t(330,176,13,400,'following')}</g>
  ${t(18,232,14,600,'Ferry')}${t(18,252,14,400,'Safe passage between chains.')}${t(18,272,14,400,'Every transfer arrives, on time, intact.')}
  <rect x="16" y="${gy-46}" width="${SW-32}" height="32" rx="8" fill="#EFEFEF"/>${t(SW/2,gy-25,13.5,600,'Follow','#111','text-anchor="middle"')}
  ${ic.grid(SW/2-12,gy-6)}<line x1="0" y1="${gy+24}" x2="${SW}" y2="${gy+24}" stroke="#000" stroke-opacity=".08"/><rect x="${SW/2-62}" y="${gy+23}" width="124" height="1.5" fill="#111"/>
  ${order.map((n,i)=>`<image href="${P(n)}" x="${(i%3)*(tw+2)}" y="${gy+26+Math.floor(i/3)*(th+2)}" width="${tw}" height="${th}" preserveAspectRatio="none"/>`).join('')}${tabBar()}`;}
// a laptop, front-on: lid 1300 wide; the slide plays full screen on a 16:10 panel, letterboxed
function laptop(cx,top,n){const lw=1300, bz=20, sw=lw-2*bz, sh=sw*9/16, lh=sh+2*bz+10, sy=top+bz+4, lx=cx-lw/2;
  const iw=sw, ih=iw*9/16, iy=sy+(sh-ih)/2, bw=lw*1.13, by=top+lh-2;
  return `<g filter="url(#shLoose)"><rect x="${lx}" y="${top}" width="${lw}" height="${lh}" rx="26" fill="#1C2023"/>
   <path d="M${cx-bw/2} ${by} H${cx+bw/2} v8 q0 12 -26 14 H${cx-bw/2+26} q-26 -2 -26 -14 z" fill="url(#alu)"/></g>
  <rect x="${lx+.75}" y="${top+.75}" width="${lw-1.5}" height="${lh-1.5}" rx="25.5" fill="none" stroke="#5E676B" stroke-width="1.5"/>
  <rect x="${lx+bz}" y="${sy}" width="${sw}" height="${sh}" fill="#000"/>
  <image href="${P(n,'16x9')}" x="${lx+bz}" y="${iy}" width="${iw}" height="${ih}" preserveAspectRatio="none"/>
  <rect x="${lx+bz}" y="${sy}" width="${sw}" height="${sh}" fill="url(#glass)"/>
  <circle cx="${cx}" cy="${top+bz/2+3}" r="3.2" fill="#2E3438"/>
  <path d="M${cx-110} ${by} h220 q-6 8 -16 8 h-188 q-10 0 -16 -8z" fill="#7F8487" opacity=".55"/>
  <rect x="${cx-bw/2}" y="${by}" width="${bw}" height="1.5" fill="#fff" opacity=".55"/>`;}

// ---------- prints ----------
// a print taped to a wall: flat at the top, the bottom lifting a little off the wall (shadow grows downward)
function taped(x,y,w,n,f='4x5',rot=0,seed=1){const h=f==='4x5'?w*5/4:w*9/16, id='tp'+(uid++);
  const sh=`M${x+2} ${y+3} L${x+w+3} ${y+3} L${x+w+9} ${y+h+12} L${x+6} ${y+h+13} Z`;
  const tape=(tx,ty,a)=>`<g transform="rotate(${a} ${tx} ${ty})" filter="url(#tape)"><rect x="${tx-38}" y="${ty-13}" width="76" height="26" fill="#DDD0AE" opacity=".78"/><rect x="${tx-38}" y="${ty-13}" width="76" height="26" fill="none" stroke="#B9AA84" stroke-opacity=".35"/>
     <rect x="${tx-38}" y="${ty-13}" width="76" height="26" fill="url(#sheen)"/></g>`;
  return `<g transform="rotate(${rot} ${x+w/2} ${y+h/2})">
   <path d="${sh}" fill="#1A1C14" opacity=".17" filter="url(#blur10)"/>
   <path d="M${x+1} ${y+1} L${x+w+1} ${y+1} L${x+w+2.5} ${y+h+3} L${x+1.5} ${y+h+3} Z" fill="#1A1C14" opacity=".14" filter="url(#blur3)"/>
   <image href="${P(n,f)}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="none"/>
   <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#curl)"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#sheen)"/>
   <rect x="${x}" y="${y}" width="${w}" height="1" fill="#fff" opacity=".5"/>
   ${tape(x+14,y+6,-38+seed*3)}${tape(x+w-14,y+6,36-seed*2)}</g>`;}
// a loose print on a table
function loose(cx,cy,w,n,f='4x5',rot=0){const h=f==='4x5'?w*5/4:w*9/16;
  return `<g transform="rotate(${rot} ${cx} ${cy})"><g filter="url(#shLoose)"><image href="${P(n,f)}" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" preserveAspectRatio="none"/></g>
   <rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" fill="url(#sheen)"/></g>`;}

// ---------- scenes ----------
const SCENES={
 1:()=>`${ground('#E6E1D7')}
   ${phone(240,107,feed(5,'1,204','Departed. Arriving in 40 seconds.',1))}
   ${phone(760,107,feed(2,'2,031','41 seconds, door to door.',6))}
   ${phone(1280,107,feed(4,'987','Departed. Crossing. Arrived.',3))}`,
 2:()=>`${ground('#E6E1D7')}
   ${phone(500,107,feed(6,'1,563','Arrived. Every time.',5))}
   ${phone(1020,107,profile([5,2,6,4,3,1]))}`,
 3:()=>`${ground('#E6E1D7')}${laptop(W/2,150,3)}`,
 4:()=>`${ground('#E9E4DA')}
   ${taped(190,260,440,3,'4x5',-.6,1)}${taped(740,260,440,5,'4x5',.3,2)}${taped(1290,260,440,4,'4x5',-.2,3)}`,
 5:()=>`<rect width="${W}" height="${H}" fill="#D9D1C2"/><rect width="${W}" height="${H}" filter="url(#linen)"/><rect width="${W}" height="${H}" filter="url(#mottle)" opacity=".35"/>
   ${loose(1430,360,700,3,'16x9',2)}${loose(1420,790,640,6,'16x9',-1.5)}
   ${loose(420,520,480,2,'4x5',-3.5)}${loose(830,600,430,6,'4x5',3)}`,
 6:()=>`${ground('#E9E4DA')}${taped(130,150,820,5,'4x5',-.4,2)}`,
};

Promise.all([fetch('../export/ferry-mark-clean.svg').then(r=>r.text())]).then(([mk])=>{
  MARKP=(mk.match(/<path[^>]*\/>/g)||[]).join('');
  document.getElementById('st').innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs>${DEFS}</defs>${SCENES[M]()}</svg>`;
  return Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode&&i.decode().catch(()=>{}))]);
}).then(()=>{document.title='ready'});
</script>
</body></html>
