<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emboss Tuner</title>
<style>
@font-face{font-family:'Ferry Sans';src:url(../type/fonts/FerrySans-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Ferry Sans';src:url(../type/fonts/FerrySans-Bold.woff2) format('woff2');font-weight:700}
:root{--bg:#22383E;--panel:#2C454B;--ink:#E9E4D8;--mute:#9FB0AE;--line:#3E5A60;--accent:#D2602C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 'Ferry Sans',system-ui,sans-serif;display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--panel);padding:22px 22px 28px;overflow:auto;max-height:100vh}
h1{font:700 13px 'Ferry Sans';letter-spacing:3px;text-transform:uppercase;margin:0 0 4px}
p.note{color:var(--mute);font-size:12.5px;margin:0 0 18px}
.group{border-top:1px solid var(--line);padding:14px 0 6px}
.group h2{font:700 11px 'Ferry Sans';letter-spacing:2.5px;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
label{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0 0 12px;font-size:13px}
label output{font-variant-numeric:tabular-nums;color:var(--mute)}
label small{grid-column:1/-1;color:var(--mute);font-size:11.5px}
input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:6px;margin:0 0 12px}.seg button{flex:1}
button{font:700 12px 'Ferry Sans';letter-spacing:1px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.on,button.primary{background:var(--ink);color:#1B262B;border-color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.actions .primary{grid-column:1/-1}
#status{color:var(--mute);font-size:12px;min-height:18px;margin-top:10px}
main{padding:22px;display:grid;gap:18px;align-content:start}
.view{position:relative;overflow:hidden;border-radius:6px;background:#E8E3D9}
.view .cap{position:absolute;left:10px;top:8px;background:rgba(232,227,217,.92);padding:4px 8px;border-radius:5px;font:700 11px 'Ferry Sans';letter-spacing:2px;color:#5E6A6E;text-transform:uppercase;z-index:2}
.view iframe{position:absolute;border:0;transform-origin:0 0;width:1800px;height:1200px;pointer-events:none}
#zoomv{width:720px;height:600px}#cardv{width:720px;height:480px}
.busy{position:absolute;right:10px;top:8px;background:rgba(232,227,217,.92);padding:4px 8px;border-radius:5px;font-size:11px;color:#5E6A6E;z-index:2}
@media (max-width:1100px){body{grid-template-columns:1fr}aside{max-height:none}}
</style></head><body>
<aside>
  <h1>Emboss tuner</h1>
  <p class="note">Every highlight and shadow comes from the lit paper, not paint. Move a slider and both views redraw. Save keeps your settings on this machine; Copy gives them to me.</p>
  <div class="group"><h2>Press</h2>
    <div class="seg" id="mode"><button data-v="emboss">Raised</button><button data-v="deboss">Pressed in</button></div>
    <div id="press"></div></div>
  <div class="group"><h2>Light</h2><div id="light"></div></div>
  <div class="group"><h2>Highlights and shade</h2><div id="tone"></div></div>
  <div class="actions"><button class="primary" id="save">Save as my settings</button><button id="copy">Copy settings</button><button id="reset">Reset</button></div>
  <div id="status"></div>
</aside>
<main>
  <div class="view" id="zoomv"><span class="cap">Corner, 2×</span><span class="busy" id="b1"></span><iframe id="zoom"></iframe></div>
  <div class="view" id="cardv"><span class="cap">The whole back</span><span class="busy" id="b2"></span><iframe id="card"></iframe></div>
</main>
<script src="emboss.js"></script>
<script>
const D=FerryEmboss.defaults;
const SLIDERS={
  press:[['mm','Size',8,30,.5,'mm','printed width of the mark'],['rotate','Tilt',-8,8,.1,'°','a hand-fed press is never quite square'],
         ['depth','Depth',.04,.4,.01,'mm','how far the paper is pushed'],['shoulder','Shoulder',.2,1.6,.05,'mm','how gently the paper rolls up to the top'],
         ['dome','Pillow',0,.6,.01,'','how rounded the top of a raised mark is']],
  light:[['az','Direction',0,360,1,'°','135 is from the top left'],['el','Height',8,80,1,'°','low is raking and dramatic, high is soft and quiet'],
         ['ambient','Fill light',.2,.9,.01,'','more fill flattens everything']],
  tone:[['highlight','Highlight strength',0,2,.01,'','the white edges'],['hlSoft','Highlight softness',0,8,.1,'px','blurs the white edges'],
        ['shadow','Shade strength',0,2,.01,'','the darker side'],['shadowSoft','Shade softness',0,8,.1,'px','blurs the shade'],
        ['floorLift','Floor lift',0,.06,.002,'','pressed in only: the crushed floor reads lighter']]
};
let S={...FerryEmboss.settings()};
function build(){
  for(const [grp,list] of Object.entries(SLIDERS)){const el=document.getElementById(grp);
    el.innerHTML=list.map(([k,n,min,max,step,u,hint])=>`<label>${n}<output id="o_${k}"></output><input type="range" id="s_${k}" min="${min}" max="${max}" step="${step}" value="${S[k]}"><small>${hint}</small></label>`).join('');
    for(const [k,,,,,u] of list){const s=document.getElementById('s_'+k),o=document.getElementById('o_'+k);
      const show=()=>o.textContent=(+s.value).toFixed(s.step<.01?3:s.step<1?2:0)+(u?' '+u:'');show();
      s.addEventListener('input',()=>{S[k]=+s.value;show();queue();});}}
  document.querySelectorAll('#mode button').forEach(b=>{b.classList.toggle('on',b.dataset.v===S.mode);
    b.onclick=()=>{S.mode=b.dataset.v;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));queue();};});
}
const zoom=document.getElementById('zoom'),card=document.getElementById('card');
function place(){
  const z=2;zoom.style.transform=`translate(${-(1600-180)*z}px,${-(1030-150)*z}px) scale(${z})`;   // the mark's corner, 360 x 300 card px, at 2x
  card.style.transform=`scale(${720/1800})`;
}
let t=null,seq=0;
function queue(){clearTimeout(t);t=setTimeout(load,280);}
function load(){
  const q=encodeURIComponent(JSON.stringify(S)),src=`postcard-01.html?side=back&emb=${q}`;const my=++seq;
  for(const [f,b] of [[zoom,'b1'],[card,'b2']]){document.getElementById(b).textContent='drawing…';
    f.onload=()=>{const poll=()=>{if(my!==seq)return;if(f.contentDocument&&f.contentDocument.title==='ready')document.getElementById(b).textContent='';else setTimeout(poll,120);};poll();};
    f.src=src;}
}
const status=m=>{document.getElementById('status').textContent=m;};
document.getElementById('save').onclick=()=>{try{localStorage.setItem('ferry.emboss',JSON.stringify(S));status('Saved. The postcard now uses these settings on this machine.');}catch(e){status('Could not save in this browser.');}};
document.getElementById('copy').onclick=async()=>{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);status('Copied. Paste it to me and I will make it the default.');}catch(e){status(txt);}};
document.getElementById('reset').onclick=()=>{S={...D};build();queue();status('Back to the built-in settings.');};
build();place();load();
</script>
</body></html>
