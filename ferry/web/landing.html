<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferry: safe passage between chains</title>
<style>
@font-face{font-family:'Ferry Sans';src:url(../type/fonts/FerrySans-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Ferry Sans';src:url(../type/fonts/FerrySans-Bold.woff2) format('woff2');font-weight:700}
:root{
  --paper:#F2EEE6;--ink:#1B262B;--harbour:#2C454B;--seaglass:#6B8A94;--mist:#C9CDBD;--stone:#D2A57F;--seagrass:#7D8F69;
  --m:64px;            /* page margin, also the nav's side inset */
  --r:4px;             /* the one radius: paper, small */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--ink);font:400 16px/1.45 'Ferry Sans',sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased}
a{color:inherit}

/* the painting is the environment: edge to edge, still */
.hero{position:relative;height:100vh;height:100svh;min-height:600px;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}

/* row 0: navigation, transparent over the sky */
nav{position:absolute;top:0;left:0;right:0;height:64px;padding:0 var(--m);display:flex;align-items:center;gap:40px;z-index:2}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:22px;letter-spacing:-.01em}
.mark{width:28px;height:24px;background:var(--ink);-webkit-mask:url(../src/butterfly-mark.svg) center/contain no-repeat;mask:url(../src/butterfly-mark.svg) center/contain no-repeat}
.links{display:flex;gap:32px;margin-left:auto;font-size:15px}
.links a{text-decoration:none}
.links a:hover{text-decoration:underline;text-underline-offset:4px}
.btn{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:var(--r);background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
.btn.primary{height:48px;padding:0 22px;font-size:16px}
.btn:hover{background:var(--harbour)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* row 1: the promise, in the sky left of the ferry */
.copy{position:absolute;left:var(--m);top:100px;width:560px;z-index:1}
h1{margin:0;font-weight:700;font-size:66px;line-height:1.02;letter-spacing:-.025em}
.support{margin:18px 0 0;max-width:500px;font-size:18px;line-height:1.45}
.actions{display:flex;align-items:center;gap:28px;margin-top:22px}
.text-link{font-weight:700;font-size:16px;text-underline-offset:5px;text-decoration-thickness:1.5px}

/* the ticket rests in the foreground water, lower right */
#ticket{position:absolute;z-index:1}
#ticket svg.ticket{position:absolute}

@media (max-width:1100px){ h1{font-size:56px} .copy{width:480px} .links{gap:24px} }
@media (max-width:720px){
  :root{--m:20px}
  nav{height:56px;gap:16px}
  .links{display:none}
  .brand{font-size:20px}
  nav .btn{margin-left:auto;height:36px;padding:0 14px;font-size:14px}
  .scene{object-position:24% 50%}
  .copy{top:84px;width:auto;right:var(--m)}
  h1{font-size:38px;line-height:1.04}
  .support{font-size:16px;max-width:290px;margin-top:14px}
  .actions{gap:20px;margin-top:20px}
  .btn.primary{height:44px;padding:0 18px;font-size:15px}
  .text-link{font-size:15px}
}
</style>
</head>
<body>
<header class="hero">
  <img class="scene" src="../assets/refs/ferry-arrival-gouache.png" alt="A painted ferry crossing calm water toward the viewer at sunset, hills behind it.">
  <nav aria-label="Main">
    <a class="brand" href="#" aria-label="Ferry home"><span class="mark" aria-hidden="true"></span>Ferry</a>
    <div class="links">
      <a href="#">Product</a><a href="#">Developers</a><a href="#">Security</a><a href="#">Pricing</a>
    </div>
    <a class="btn" href="#">Request access</a>
  </nav>
  <div class="copy">
    <h1>Safe passage<br>between chains.</h1>
    <p class="support">Send stablecoins between 40 chains and follow each one from pier to arrival. Median crossing, 14 seconds.</p>
    <div class="actions">
      <a class="btn primary" href="#">Send a test crossing</a>
      <a class="text-link" href="#">Read the docs</a>
    </div>
  </div>
  <div id="ticket" role="img" aria-label="Live transfer ticket: USDC from Solana to Ethereum"></div>
</header>
<script src="../print/stamp.js"></script>
<script src="../print/ticket.js"></script>
<script src="landing.js"></script>
</body>
</html>
