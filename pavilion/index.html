<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pavilion</title>
<meta name="description" content="A musician in a rose pavilion, painted live in your browser by a simulation of water and pigment, then brought to life.">
<meta name="theme-color" content="#fbf8f1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Pavilion">
<meta property="og:description" content="A musician in a rose pavilion, painted live, then brought to life.">
<meta property="og:image" content="https://madebypuru.github.io/experiments/pavilion/og.jpg">
<meta property="og:url" content="https://madebypuru.github.io/experiments/pavilion/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#4d4238;--paper:#fbf8f1}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Shantell Sans",ui-rounded,system-ui,sans-serif}
  #c,#ink,#snow{position:fixed;inset:0;width:100%;height:100%}
  #snow{pointer-events:none}
  #ink{mix-blend-mode:multiply;pointer-events:none}
  #hit{position:fixed;inset:0;touch-action:none}
  .setup #hit{cursor:crosshair}
  .title{position:fixed;left:20px;top:16px;font-size:17px;font-weight:500;display:flex;align-items:baseline;gap:6px;z-index:2}
  .title i{font-weight:400;opacity:.6}
  .link{font:inherit;font-size:14px;color:var(--ink);background:none;border:0;padding:0 0 0 14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;opacity:.75;display:none}
  .setup .link,.done .link{display:inline}
  #ref{position:fixed;opacity:0;pointer-events:none;transition:opacity .6s;object-fit:fill;border-radius:2px}
  .setup #ref{opacity:1}
  .painting #ref,.painting #veil,.painting #ring{opacity:0;transition:none}
  #brush{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .25s;
    background:radial-gradient(circle,rgba(58,46,39,.55) 0 35%,rgba(58,46,39,.18) 36% 60%,rgba(58,46,39,0) 62%);box-shadow:0 0 0 1px rgba(58,46,39,.35)}
  #brush.on{opacity:1}
  #brush.pen{width:8px;height:8px;margin:-4px 0 0 -4px;background:#3a2e27;box-shadow:none}
  .progress{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 46px);width:min(220px,60vw);height:2px;
    background:rgba(90,70,40,.15);border-radius:2px;overflow:hidden;opacity:0;transition:opacity .4s}
  .painting .progress{opacity:1}
  .progress i{display:block;height:100%;width:0;background:var(--ink)}
  #ring{position:fixed;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .3s}
  .setup #ring{opacity:1}
  #veil{position:fixed;pointer-events:none;opacity:0;transition:opacity .3s}
  .setup #veil{opacity:1}
  #ring::before{content:"";position:absolute;left:-36px;top:-36px;width:72px;height:72px;border-radius:50%;border:2px dashed rgba(77,66,56,.7);background:rgba(251,248,241,.18)}
  #ring::after{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
  #thumb{position:fixed;right:18px;top:14px;max-width:120px;max-height:84px;border-radius:3px;opacity:0;transition:opacity .6s;box-shadow:0 0 0 1px rgba(90,70,40,.12)}
  .painting #thumb,.done #thumb{opacity:.9}
  .setup #ring::before{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .drop{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
  .empty .drop{display:grid}
  .drop .box{max-width:420px}
  .drop h1{font-size:30px;font-weight:500;margin:0 0 10px}
  .drop p{margin:0 0 22px;opacity:.75;line-height:1.5}
  .btn{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:0;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 0 0 1px rgba(90,70,40,.25)}
  .btn.primary{background:var(--ink);color:var(--paper);box-shadow:none}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{padding-left:18px;padding-right:18px}
  .dragging .drop .box{outline:2px dashed rgba(77,66,56,.5);outline-offset:24px;border-radius:12px}
  .bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;max-width:calc(100vw - 24px)}
  .setup .bar,.painting .bar,.done .bar{display:flex}
  .group{display:none;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center}
  .setup [data-for=setup],.painting [data-for=painting],.done [data-for=done]{display:flex}
  .style-iw #inkBtn{display:none}
  .bar .btn{padding:7px 14px;font-size:14px}
  .seg{display:inline-flex;border-radius:999px;box-shadow:0 0 0 1px rgba(90,70,40,.25);overflow:hidden}
  .seg button{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:0;padding:7px 11px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .switch[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
  .status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 56px);font-size:14px;opacity:.8;pointer-events:none;text-align:center;width:max-content;max-width:calc(100vw - 32px)}
  .err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:var(--paper)}
  input[type=file]{display:none}
  .bar,.drop,#thumb,.title,#ref,#veil,#ring{display:none!important}
  .still .bar,.still .status,.still .title,.still #thumb{display:none}
</style>
</head>
<body class="empty">
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="ink" aria-hidden="true"></canvas>
<canvas id="snow" aria-hidden="true"></canvas>
<img id="ref" alt="">
<canvas id="veil" aria-hidden="true"></canvas>
<div id="ring"></div>
<div id="hit" aria-label="The photo. Tap to choose where the painting focuses."></div>
<img id="thumb" alt="The photo being painted">
<div class="title">Paint <i>photo to watercolour</i><button class="link" id="newPhoto">New photo</button></div>
<div class="drop"><div class="box">
  <h1>Turn a photo into a watercolour</h1>
  <p>It's painted live, wash by wash, by a simulation of water and pigment on paper. It paints the parts that matter and lets the rest fade to paper. Your photo stays on this device.</p>
  <button class="btn primary" id="choose">Choose a photo</button>
  <p style="margin-top:14px;font-size:13px">or drop or paste one here</p>
</div></div>
<div id="brush"></div>
<div class="status" id="status" aria-live="polite"></div>
<div class="progress"><i id="prog"></i></div>
<div class="bar" id="bar">
  <div class="group" data-for="setup">
    <span class="seg" id="style" role="group" aria-label="Style"><button data-v="wc">Watercolour</button><button data-v="iw">Ink &amp; wash</button></span>
    <span class="seg" id="detail" role="group" aria-label="Detail"><button data-v="0">Loose</button><button data-v="1">Balanced</button><button data-v="2">Fine</button></span>
    <button class="btn switch" id="inkBtn" aria-pressed="false">Ink</button>
    <button class="btn primary" id="go">Start painting</button>
  </div>
  <div class="group" data-for="painting">
    <button class="btn" id="back">Back to setup</button>
    <button class="btn primary" id="finish">Finish now</button>
  </div>
  <div class="group" data-for="done">
    <button class="btn" id="again">Paint again</button>
    <button class="btn" id="more">Add detail</button>
    <button class="btn" id="night">Day to night</button>
    <button class="btn" id="seasons">Seasons</button>
    <button class="btn primary" id="save">Download</button>
  </div>
</div>
<input type="file" id="file" accept="image/*">
<div class="err" id="err"></div>
<script>
// Photo to watercolour, painted by the same small Curtis-style simulation as Meadow
// (Curtis et al. 1997, simplified, on the GPU). Nothing here generates an image: the photo is
// only read for colours, regions and edges, and turned into a list of washes a painter might lay.
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false});
function fail(m){const e=document.getElementById('err');e.style.display='grid';e.textContent=m;throw new Error(m);}
if(!gl)fail('This needs WebGL2, which this browser does not have.');
if(!gl.getExtension('EXT_color_buffer_float'))fail('This browser cannot render to float textures, which the paint simulation needs.');
const Q=new URLSearchParams(location.search);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

// ---------- GL plumbing ----------
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
const HEAD=`#version 300 es
precision highp float;precision highp int;precision highp sampler2D;
uniform ivec2 sz;
ivec2 C(ivec2 p){return clamp(p,ivec2(0),sz-1);}
`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))fail(gl.getShaderInfoLog(s));return s;}
function program(fs){
  const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,HEAD+fs));
  gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))fail(gl.getProgramInfoLog(p));
  const locs={};return {p,loc:k=>k in locs?locs[k]:(locs[k]=gl.getUniformLocation(p,k))};
}
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
function tex(w,h,fl=true,data=null){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  if(fl)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,w,h,0,gl.RGBA,gl.FLOAT,data);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
  for(const k of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,k,gl.NEAREST);
  for(const k of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE);
  return t;
}
const fbos=new Map();
function fbo(outs){
  const key=outs.map(t=>t.id).join(',');
  if(!fbos.has(key)){const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    outs.forEach((t,i)=>gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0));
    gl.drawBuffers(outs.map((_,i)=>gl.COLOR_ATTACHMENT0+i));fbos.set(key,f);}
  return fbos.get(key);
}
let tid=0;
function pair(w,h){const a=tex(w,h),b=tex(w,h);a.id=++tid;b.id=++tid;return {a,b,swap(){[this.a,this.b]=[this.b,this.a];}};}
function draw(Pg,u,outs,vw,vh){
  gl.bindFramebuffer(gl.FRAMEBUFFER,outs?fbo(outs):null);gl.viewport(0,0,vw,vh);gl.useProgram(Pg.p);
  let unit=0;
  for(const k in u){const l=Pg.loc(k);if(l==null)continue;const v=u[k];
    if(v instanceof WebGLTexture){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,v);gl.uniform1i(l,unit++);}
    else if(typeof v==='number')gl.uniform1f(l,v);
    else if(v.i)v.i.length===1?gl.uniform1i(l,v.i[0]):gl.uniform2i(l,v.i[0],v.i[1]);
    else if(v.length===2)gl.uniform2f(l,...v);else if(v.length===3)gl.uniform3f(l,...v);else if(v.length===4)gl.uniform4f(l,...v);}
  gl.drawArrays(gl.TRIANGLES,0,3);
}

// ---------- the simulation (as in Meadow) ----------
const FLOW=program(`
uniform sampler2D W,G,P;uniform float kw,kd,kg,kh,evap,evapEdge,front;
layout(location=0) out vec4 oW;layout(location=1) out vec4 oG;
void main(){
  ivec2 p=ivec2(gl_FragCoord.xy);
  float w=texelFetch(W,p,0).x;vec3 g=texelFetch(G,p,0).rgb;vec4 pp=texelFetch(P,p,0);
  float th=front*(.3+1.7*pp.b);
  vec3 c=g/max(w,.002);
  bool me=w>1e-4;float dw=0.,wn=0.;vec3 dg=vec3(0);
  ivec2 O[4]=ivec2[4](ivec2(1,0),ivec2(-1,0),ivec2(0,1),ivec2(0,-1));
  for(int i=0;i<4;i++){
    ivec2 q=C(p+O[i]);
    float wq=texelFetch(W,q,0).x;vec4 pq=texelFetch(P,q,0);
    bool nq=wq>1e-4;wn+=float(nq);
    float thq=front*(.3+1.7*pq.b);
    bool both=me&&nq;
    bool ok=both||(!me&&nq&&wq>th)||(me&&!nq&&w>thq);
    if(!ok)continue;
    vec3 gq=texelFetch(G,q,0).rgb,cq=gq/max(wq,.002);
    float f=kw*min(pp.g,pq.g)*((wq+kh*pq.r)-(w+kh*pp.r));
    if(!both)f*=kd;
    f=clamp(f,-w*.24,wq*.24);
    dw+=f;dg+=f*(f>0.?cq:c);
    dg+=kg*min(w,wq)*(cq-c);
  }
  w+=dw;g=max(g+dg,0.);
  if(w>0.)w=max(0.,w-evap-evapEdge*(1.-wn*.25));
  oW=vec4(w,0,0,1);oG=vec4(g,1);
}`);
const SETTLE=program(`
uniform sampler2D W,G,D,P;uniform float dep,gran,lift;
layout(location=0) out vec4 oG;layout(location=1) out vec4 oD;
void main(){
  ivec2 p=ivec2(gl_FragCoord.xy);
  float w=texelFetch(W,p,0).x;vec3 g=texelFetch(G,p,0).rgb,d=texelFetch(D,p,0).rgb;float h=texelFetch(P,p,0).r;
  float valley=(1.-h)*(1.-h);
  float r=w<.003?1.:dep+gran*valley;
  vec3 x=g*r;g-=x;d+=x;
  if(w>=.003){vec3 l=d*lift*(.4+h);d-=l;g+=l;}
  oG=vec4(g,1);oD=vec4(d,1);
}`);
// A wash read from the photo: per-cell pigment (rgb) and water (a), laid down a slice at a time.
// O holds the order the brush reaches each cell (0..1); [lo,hi) is the slice laid this frame.
const LAY=program(`
uniform sampler2D W,G,F,O,P;uniform float lo,hi;
layout(location=0) out vec4 oW;layout(location=1) out vec4 oG;
void main(){
  ivec2 p=ivec2(gl_FragCoord.xy);
  float o=texelFetch(O,p,0).r;
  float m=step(lo,o)*(1.-step(hi,o));
  vec4 f=texelFetch(F,p,0);
  m*=.9+.2*texelFetch(P,p,0).b;
  oW=vec4(texelFetch(W,p,0).x+f.a*m,0,0,1);
  oG=vec4(texelFetch(G,p,0).rgb+f.rgb*m,1);
}`);
// Lifting: rewet an area and blot it, taking pigment back off the paper (floating and settled alike).
const LIFT=program(`
uniform sampler2D W,G,D,F,O,P;uniform float lo,hi,strength;
layout(location=0) out vec4 oW;layout(location=1) out vec4 oG;layout(location=2) out vec4 oD;
void main(){
  ivec2 p=ivec2(gl_FragCoord.xy);
  float o=texelFetch(O,p,0).r,m=step(lo,o)*(1.-step(hi,o))*texelFetch(F,p,0).a;
  float k=clamp(m*strength,0.,1.);
  oW=vec4(texelFetch(W,p,0).x+m*.05,0,0,1);
  oG=vec4(texelFetch(G,p,0).rgb*(1.-k),1);oD=vec4(texelFetch(D,p,0).rgb*(1.-k),1);
}`);
const SHOW=program(`
uniform sampler2D W,G,D,P;uniform vec4 map;uniform float density,dpr;
out vec4 o;
float hh(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(hh(i),hh(i+vec2(1,0)),u.x),mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),u.x),u.y);}
float tooth(vec2 q){return .5*vn(q/2.4)+.3*vn(q/6.5)+.2*vn(q/18.);}
vec4 bl(sampler2D T,vec2 s){ivec2 i=ivec2(floor(s));vec2 f=fract(s);
  return mix(mix(texelFetch(T,C(i),0),texelFetch(T,C(i+ivec2(1,0)),0),f.x),mix(texelFetch(T,C(i+ivec2(0,1)),0),texelFetch(T,C(i+ivec2(1,1)),0),f.x),f.y);}
void main(){
  vec2 s=vec2(gl_FragCoord.x*map.x+map.y,gl_FragCoord.y*map.z+map.w);
  float inside=float(all(greaterThan(s,vec2(-1)))&&all(lessThan(s,vec2(sz))));
  vec2 q=gl_FragCoord.xy/dpr;
  float h=tooth(q),rel=tooth(q+vec2(-.7,.7))-tooth(q+vec2(.7,-.7));
  vec3 a=vec3(0);
  for(int i=0;i<4;i++){vec2 j=vec2(i==0||i==2?-.4:.4,i<2?-.4:.4);a+=bl(D,s+j).rgb+bl(G,s+j).rgb*.85;}
  a*=.25*density*(.8+.4*(1.-h))*inside;
  float w=bl(W,s).x*inside;
  vec3 paper=vec3(.984,.969,.936)*(.978+.03*(h-.5)+.06*rel);
  vec3 col=paper*exp(-a);
  col*=1.-.06*smoothstep(0.,.08,w);
  o=vec4(col,1);
}`);
const P={kw:.2,kd:.06,kg:.03,kh:.03,evap:.0005,evapEdge:.0012,front:.14,dep:.0004,gran:.0004,lift:.0003};
const STEPS_PER_SEC=300,DENSITY=.6,PAPER=[.984,.969,.936];
// Detail: 0 loose, 1 balanced, 2 fine. Remembered between visits.
let DETAIL=1;try{DETAIL=clamp(+(localStorage.getItem('paint.detail')??1),0,2);}catch(e){}
if(Q.has('detail'))DETAIL=clamp(+Q.get('detail'),0,2);
// Style: 'wc' loose watercolour, 'iw' ink & wash (pen sketch, flat bright washes, lavender shadows)
let STYLE='wc';try{STYLE=localStorage.getItem('paint.style')||'wc';}catch(e){}
if(Q.get('style'))STYLE=Q.get('style');
const IW=()=>STYLE==='iw';
const LV=(...v)=>v[DETAIL];

let W,H,SW,SH,S,Wt,Gt,Dt,paper,fieldTex,orderTex,fieldBuf;
function hash(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,982451653)|0;
  h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function makePaper(){
  const d=new Uint8Array(SW*SH*4),seed=Math.floor(Math.random()*1e6);
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){
    const i=(y*SW+x)*4;
    const h=.45*vn(x/3.2,y/3.2,seed)+.35*vn(x/8,y/8,seed+1)+.2*vn(x/22,y/22,seed+2);
    const perm=.35+.65*(.7*vn(x/28,y/28,seed+3)+.3*vn(x/9,y/9,seed+4));
    const res=clamp((.55*vn(x/12,y/12,seed+5)+.45*vn(x/40,y/40,seed+6)-.5)*1.7+.5,0,1);
    d[i]=h*255;d[i+1]=perm*255;d[i+2]=res*255;d[i+3]=255;}
  return tex(SW,SH,false,d);
}
function setupGL(){
  W=innerWidth;H=innerHeight;const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;
}
// The simulation only covers the painting and a margin for it to bleed into, so every cell is spent on
// the picture: about one cell per screen pixel or finer.
let GOX=0,GOY=0,grid=null;
function allocGrid(rect){
  const m=Math.max(rect.w,rect.h)*.06;GOX=rect.x-m;GOY=rect.y-m;
  const cw=rect.w+2*m,ch=rect.h+2*m;
  S=Math.min(2.5,Math.sqrt((+(Q.get('px'))||LV(600000,1100000,1800000))/(cw*ch)));SW=Math.round(cw*S);SH=Math.round(ch*S);
  if(grid)for(const t of grid)gl.deleteTexture(t);
  for(const f of fbos.values())gl.deleteFramebuffer(f);fbos.clear();
  Wt=pair(SW,SH);Gt=pair(SW,SH);Dt=pair(SW,SH);paper=makePaper();
  fieldTex=tex(SW,SH);orderTex=tex(SW,SH);fieldBuf=new Float32Array(SW*SH*4);
  grid=[Wt.a,Wt.b,Gt.a,Gt.b,Dt.a,Dt.b,paper,fieldTex,orderTex];
  clearAll();
}
function clearAll(){
  if(!Wt)return;gl.clearColor(0,0,0,0);
  for(const p of [Wt,Gt,Dt])for(const t of [p.a,p.b]){gl.bindFramebuffer(gl.FRAMEBUFFER,fbo([t]));gl.clear(gl.COLOR_BUFFER_BIT);}
}
const sz=()=>({i:[SW,SH]});

// The painted shape follows the subject: where the detail and colour are, pulled a little toward the
// focus, kept as one main silhouette with a ragged edge. Outside it is bare paper.
function keepMain(B,w,h){
  const lab=new Int32Array(B.length).fill(-1),sizes=[];let id=0;
  for(let s0=0;s0<B.length;s0++){if(!B[s0]||lab[s0]>=0)continue;let cnt=0;const st=[s0];lab[s0]=id;
    while(st.length){const i=st.pop();cnt++;const x=i%w,y=(i-x)/w;
      for(const j of [x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1])if(j>=0&&B[j]&&lab[j]<0){lab[j]=id;st.push(j);}}
    sizes.push(cnt);id++;}

function setFocus(fx,fy){

    const prior=Math.exp(-(((u-fx)/.48)**2+((v-fy)/.48)**2)),edge=Math.min(u,1-u,v,1-v);
    const wob=(vn(x/14,y/14,sd)-.5)*.5+(vn(x/40,y/40,sd+1)-.5)*.6;

// ---------- the painting plan ----------
// Lightest first, like a painter: an underwash in bands, colour glazes light to dark,
// dark accents, then (optionally) ink. Each wash is laid in brush sweeps, top to bottom.

    const dir=band%2?1-x/I.gw:x/I.gw;

  for(let i=0;i<SW*SH;i++)if(!b[i*4])b[i*4]=2; // cells outside the photo are never reached
  upload(orderTex,b);

function fieldFrom(fn){

    const j=((SH-1-(I.gy0+y))*SW+I.gx0+x)*4;fieldBuf[j]=v[0];fieldBuf[j+1]=v[1];fieldBuf[j+2]=v[2];fieldBuf[j+3]=v[3];}

  ev.push({t:.2,dur:2.4,label:'Laying a pale underwash',make:()=>fieldFrom(i=>{const m=I.Fu[i]*(1-I.HL[i])*I.dry[i];if(m<.01)return 0;
    const k=lerp(.2,.42,I.Fg[i]),w=lerp(.32,.26,I.Fg[i]);   // past the shape: paler, wetter

  cl.forEach((c,k)=>groups[Math.min(1,Math.floor(k/cl.length*2))].push(c.k));

function paintEndFor(){return 19+LV(0,1,2)*2.4;}
// Ink & wash, the way an urban sketcher works: pen first, then flat bright washes light to dark,
// leaves dabbed in two greens, shadows glazed lavender, a few darks last.
const LAV=[.72,.72,.88].map(v=>-Math.log(v)/DENSITY);
function stampLeaves(I,where,size,count,seed){
  const c=document.createElement('canvas');c.width=I.gw;c.height=I.gh;const g=c.getContext('2d');g.fillStyle='#fff';
  let placed=0;for(let tries=0;tries<count*12&&placed<count;tries++){
    const x=Math.random()*I.gw,y=Math.random()*I.gh,i=Math.floor(y)*I.gw+Math.floor(x);if(!where(i))continue;placed++;
    const s=size*rnd(.7,1.3),a=rnd(0,Math.PI*2);g.save();g.translate(x,y);g.rotate(a);g.beginPath();
    g.moveTo(-s,0);g.quadraticCurveTo(0,-s*.55,s,0);g.quadraticCurveTo(0,s*.55,-s,0);g.fill();g.restore();}
  const d=g.getImageData(0,0,I.gw,I.gh).data,m=new Float32Array(I.n);for(let i=0;i<I.n;i++)m[i]=d[i*4+3]/255;return m;
}
function planInkWash(){
  const I=IM,ev=[],mm=Math.min(I.gw,I.gh),hk=.8; // high-key: everything a little lighter
  INK={start:.2,dur:3.8,label:'Sketching in pen'};
  const cl=I.clusters.filter(c=>c.count&&c.L<92).sort((a,b)=>b.L-a.L),groups=[[],[],[]];
  cl.forEach((c,k)=>groups[Math.min(2,Math.floor(k/cl.length*3))].push(c.k));
  const inGroup=g=>{const st=new Set(g),ind=new Float32Array(I.n);for(let i=0;i<I.n;i++)ind[i]=st.has(I.lab[i])?1:0;
    const crisp=boxBlur(ind,I.gw,I.gh,1.2),soft=boxBlur(ind,I.gw,I.gh,Math.max(3,mm*.025));
    return crisp.map((c,i)=>{const e=smooth(.15,.5,I.Ed[i]);return lerp(smooth(.02,.6,soft[i]),smooth(.3,.7,c),e);});};
  ['Washing in the light colours','Washing in the middle colours','Washing in the deeper colours'].forEach((label,k)=>{if(!groups[k].length)return;
    ev.push({t:4.3+k*2.9,dur:2.1,label,make:()=>{const M=inGroup(groups[k]),cs=I.clusters;fieldFrom(i=>{
      const m=M[i]*I.Fg[i]*(1-I.HL[i])*(1-.55*I.leaf[i]);if(m<.01)return 0;const c=cs[I.lab[i]].A;
      return [(.5*c[0]+.18*I.Br[i])*hk*m,(.5*c[1]+.18*I.Bg[i])*hk*m,(.5*c[2]+.18*I.Bb[i])*hk*m,.12*m];});}});});
  let t=12.9;
  if(I.leaf.reduce((a,v)=>a+v,0)>I.n*.02){
    const sz=mm*LV(.02,.015,.011),area=I.leaf.reduce((a,v,i)=>a+v*I.Fg[i],0),n=Math.round(area/(sz*sz)*LV(.5,.7,.9));
    ev.push({t,dur:1.6,label:'Dabbing in leaves',make:()=>{const S2=stampLeaves(I,i=>I.leaf[i]>.35&&I.Fg[i]>.3,sz,n);fieldFrom(i=>{
      const m=S2[i]*I.leaf[i]*I.Fg[i];if(m<.02)return 0;return [.5*I.Br[i]*hk*m,.5*I.Bg[i]*hk*m,.5*I.Bb[i]*hk*m,.06*m];});}});
    ev.push({t:t+1.9,dur:1.4,label:'Darker leaves',make:()=>{const S2=stampLeaves(I,i=>I.leaf[i]>.35&&I.Fg[i]>.3&&I.L[i]<I.Lmid[i]-2,sz*.8,Math.round(n*.6));fieldFrom(i=>{
      const m=S2[i]*I.leaf[i]*I.Fg[i];if(m<.02)return 0;return [.75*I.Ar[i]*m,.75*I.Ag[i]*m,.75*I.Ab[i]*m,.05*m];});}});
    t+=3.6;}
  const sh=boxBlur(I.L.map((v,i)=>smooth(4,14,I.Lbig[i]-v)*smooth(85,25,v)),I.gw,I.gh,Math.max(1.2,mm*.004));
  ev.push({t,dur:1.6,label:'Glazing the shadows',make:()=>fieldFrom(i=>{
    const m=smooth(.15,.5,sh[i])*I.Fg[i]*(1-.6*I.leaf[i]);if(m<.02)return 0;
    return [(.95*LAV[0]+.22*I.Ar[i])*m,(.95*LAV[1]+.22*I.Ag[i])*m,(.95*LAV[2]+.22*I.Ab[i])*m,.08*m];})});
  t+=2.1;
  ev.push({t,dur:1.2,label:'Picking out the darks',make:()=>fieldFrom(i=>{
    const d=smooth(LV(8,6,4),LV(22,18,14),I.Lmid[i]-I.L[i])*smooth(55,20,I.L[i]),m=d*I.Fg[i];if(m<.03)return 0;
    return [.5*I.Ar[i]*m,.5*I.Ag[i]*m,.5*I.Ab[i]*m,.035*m];})});
  t+=1.6;
  const passes=LV(0,1,2);for(let k=0;k<passes;k++)ev.push(detailEvent(k,t+.4+k*2.2));

// ---------- the scene's parts, for the animations ----------
function components(B,w,h){
  const lab=new Int32Array(B.length).fill(-1),comps=[];
  for(let s0=0;s0<B.length;s0++){if(!B[s0]||lab[s0]>=0)continue;const id=comps.length,st=[s0],px=[];lab[s0]=id;
    let x0=1e9,y0=1e9,x1=-1,y1=-1;
    while(st.length){const i=st.pop();px.push(i);const x=i%w,y=(i-x)/w;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
      for(const j of [x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1])if(j>=0&&B[j]&&lab[j]<0){lab[j]=id;st.push(j);}}
    comps.push({px,x0,y0,x1,y1});}
  return comps;
}
function parts(){
  const I=IM;if(I.parts)return I.parts;const {gw,gh,n}=I,mm=Math.min(gw,gh);
  // sky: calm, not warm, reachable from the top edge
  const c=new Uint8Array(n);for(let i=0;i<n;i++){const y=Math.floor(i/gw);c[i]=y<gh*.7&&I.Ed[i]<.14&&I.L[i]>35&&I.leaf[i]<.3?1:0;}
  const skyB=new Uint8Array(n),st=[];for(let x=0;x<gw;x++)if(c[x]){skyB[x]=1;st.push(x);}
  while(st.length){const i=st.pop(),x=i%gw,y=(i-x)/gw;for(const j of [x>0?i-1:-1,x<gw-1?i+1:-1,y>0?i-gw:-1,y<gh-1?i+gw:-1])if(j>=0&&c[j]&&!skyB[j]){skyB[j]=1;st.push(j);}}
  const sky=boxBlur(skyB,gw,gh,2);
  // lights: small dark shapes on buildings, roughly rectangular (glass looks dark by day)
  const dk=new Uint8Array(n);for(let i=0;i<n;i++)dk[i]=I.Lmid[i]-I.L[i]>7&&I.L[i]<60&&I.Fg[i]>.5&&I.leaf[i]<.35&&sky[i]<.3?1:0;
  const amin=Math.max(3,(mm*.005)**2),amax=(mm*.06)**2;
  const lit=components(dk,gw,gh).filter(o=>{const w=o.x1-o.x0+1,h=o.y1-o.y0+1,a=o.px.length;return a>=amin&&a<=amax&&w/h>.2&&w/h<5&&a/(w*h)>.35;}).slice(0,80);
  const LB=new Float32Array(n);for(const o of lit)for(const i of o.px)LB[i]=1;
  // ground under foliage: a band below the leaves, for fallen leaves
  const ground=new Float32Array(n);
  for(let x=0;x<gw;x++){let last=-1e9;for(let y=0;y<gh;y++){const i=y*gw+x;if(I.leaf[i]>.4){last=y;continue;}
    if(y-last<gh*.14&&I.Fu[i]>.4&&sky[i]<.3)ground[i]=1;}}
  // top edges: lighter above, darker below; where snow settles
  const tops=new Float32Array(n);
  for(let y=3;y<gh-3;y++)for(let x=0;x<gw;x++){const i=y*gw+x,d=I.Lmid[i-2*gw]-I.Lmid[i+2*gw];
    if(d>10&&I.Ed[i]>.2&&I.Fg[i]>.4)for(let k=0;k<3;k++)tops[i+k*gw]=1;}
  // bare branches: for each tree's leaf mass, a trunk from its base splitting into tapering branches
  const branches=[],TB=new Uint8Array(n);for(let i=0;i<n;i++)TB[i]=I.leaf[i]>.35&&I.Fu[i]>.3?1:0;
  const inside=boxBlur(TB,gw,gh,Math.max(2,mm*.02));
  for(const o of components(TB,gw,gh).filter(o=>o.px.length>n*.004).slice(0,6)){
    let bx=0,cnt=0;for(const i of o.px){const y=Math.floor(i/gw);if(y>o.y1-(o.y1-o.y0)*.15){bx+=i%gw;cnt++;}}bx/=cnt||1;
    const H2=o.y1-o.y0,grow=(x,y,a,len,w,depth)=>{
      const pts=[[x,y]];let cx=x,cy=y,ca=a;
      for(let k=0;k<8;k++){ca+=rnd(-.18,.18);cx+=Math.cos(ca)*len/8;cy+=Math.sin(ca)*len/8;
        const j=Math.round(cy)*gw+Math.round(cx);if(cx<0||cy<0||cx>=gw||cy>=gh||(depth<5&&inside[j]<.15))break;pts.push([cx,cy]);}
      if(pts.length>1)branches.push({pts,w});

        for(let k=0;k<kids+1;k++)grow(ex,ey,ca+rnd(-.75,.75)+(k-kids/2)*.35,len*rnd(.6,.78),w*.62,depth-1);}};
    const base=Math.min(gh-1,o.y1+H2*.12);grow(bx,base,-Math.PI/2+rnd(-.1,.1),H2*.45,Math.max(1.5,mm*.006),5);
  }

const C2A=c=>c.map(v=>-Math.log(v)/DENSITY);
function glaze(t,dur,label,mask,color,conc,water){return {t,dur,label,make:()=>{const A=C2A(color);
  fieldFrom(i=>{const m=mask(i);return m<.01?0:[A[0]*conc*m,A[1]*conc*m,A[2]*conc*m,water*m];});}};}
function blot(t,dur,label,mask,strength){return {t,dur,label,lift:strength,make:()=>fieldFrom(i=>{const m=mask(i);return m<.01?0:[0,0,0,m];})};}
function dabs(t,dur,label,where,size,count,color,conc,water){return {t,dur,label,make:()=>{const S2=stampLeaves(IM,where,size,count),A=C2A(color);
  fieldFrom(i=>{const m=S2[i];return m<.02?0:[A[0]*conc*m,A[1]*conc*m,A[2]*conc*m,water*m];});}};}
function runExtra(evs){
  fast=false;const fb=$('finish');fb.disabled=false;fb.textContent='Finish now';
  evs.sort((a,b)=>a.t-b.t);events.push(...evs);passStart=simT;
  const last=evs[evs.length-1];endT=Math.max(endT,last.t+last.dur+2.2);setState('painting');
}

// Day to night: golden hour, dusk, night. Window-like shapes are lifted back to paper and dropped
// with warm yellow while wet, so they glow; a moon and stars are lifted out of the sky.
function dayToNight(){
  const I=IM,Pt=parts(),{gw,gh}=I,mm=Math.min(gw,gh),t=simT+.3,F=i=>I.Fu[i];
  // warm the land; the sky only gets a light peach toward the horizon (yellow over blue would turn green)
  const ev=[glaze(t,2.2,'Golden hour',i=>F(i)*(1-.9*Pt.sky[i]),[1,.86,.64],.85,.14)];
  if(Pt.skyArea>.03)ev.push(glaze(t+2.6,1.5,'Golden hour: a warm horizon',i=>F(i)*Pt.sky[i]*smooth(.15,.7,Math.floor(i/gw)/gh),[1,.86,.76],.55,.12));
  ev.push(glaze(t+4.6,2.2,'Dusk',F,[.8,.76,.92],1,.12));
  ev.push(glaze(t+7.4,2.4,'Night',i=>F(i)*(1-Pt.lightsSoft[i]),[.5,.55,.8],1.1,.14));
  ev.push(glaze(t+10.3,1.6,'Night deepens',i=>F(i)*(1-Pt.lightsSoft[i])*Math.min(1,Pt.sky[i]*.8+(1-Math.floor(i/gw)/gh)*.45),[.55,.6,.85],.9,.12));
  // the moon and stars, lifted from the sky
  const moonStars=new Float32Array(I.n);
  if(Pt.skyArea>.03){
    let best=-1,bv=-1;const sb=boxBlur(Pt.sky,gw,gh,mm*.06);
    for(let y=Math.floor(gh*.08);y<gh*.4;y++)for(let x=Math.floor(gw*.15);x<gw*.85;x++){const i=y*gw+x,v=sb[i]*(I.Fu[i]>.95?1:0)*(1-y/gh)*(.6+.4*x/gw);if(v>bv){bv=v;best=i;}}
    if(best>=0&&bv>.5){const mx=best%gw,my=Math.floor(best/gw),r=mm*.035;
      for(let y=Math.max(0,Math.floor(my-r-2));y<Math.min(gh,my+r+2);y++)for(let x=Math.max(0,Math.floor(mx-r-2));x<Math.min(gw,mx+r+2);x++)
        moonStars[y*gw+x]=Math.max(moonStars[y*gw+x],smooth(r+1,r-1,Math.hypot(x-mx,y-my)));}
    for(let k=0,tries=0;k<28&&tries<4000;tries++){const i=Math.floor(Math.random()*I.n);if(Pt.sky[i]<.85||Math.floor(i/gw)>gh*.55||I.Fu[i]<.95)continue;
      const x=i%gw,y=Math.floor(i/gw),r=rnd(1,2.1);k++;
      for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const j=(y+dy)*gw+x+dx;if(j>=0&&j<I.n)moonStars[j]=Math.max(moonStars[j],smooth(r+.6,r-.4,Math.hypot(dx,dy)));}}
  }
  ev.push(blot(t+12.3,1.2,Pt.lightCount?'Lifting out the lights':'Lifting out the moon',i=>Math.max(Pt.lights[i],moonStars[i]),1));
  if(Pt.lightCount){
    ev.push(glaze(t+13.8,1.2,'Lights on',i=>Math.min(1,Pt.lights[i]+Pt.lightsSoft[i]*.6),[1,.83,.48],1.1,.2));
    ev.push(glaze(t+15.3,1.1,'A soft glow',i=>Pt.glow[i]*(1-Pt.lights[i]),[1,.88,.62],.45,.22));
  }
  runExtra(ev);

// Seasons, from the painting as it is: autumn, winter, spring, back to summer.
let snowOn=false;
function seasons(){
  const I=IM,Pt=parts(),{gw,gh}=I,mm=Math.min(gw,gh),t=simT+.3;
  if(Pt.leafArea<.015){statusEl.textContent="There aren't enough trees or plants in this photo for seasons. Try one with greenery.";return;}
  const leaf=i=>I.leaf[i]*I.Fu[i],sz=mm*.014,n=Math.round(Pt.leafArea*I.n/(sz*sz)*.75),gArea=Pt.ground.reduce((a,v)=>a+v,0);
  const onLeaf=i=>I.leaf[i]>.35&&I.Fu[i]>.3,ev=[];
  // autumn
  ev.push(blot(t,1.6,'Autumn: lifting the greens',leaf,.6));
  ev.push(dabs(t+2,1.4,'Autumn: ochre',onLeaf,sz,Math.round(n*.6),[.93,.74,.36],1,.06));
  ev.push(dabs(t+3.6,1.3,'Autumn: orange',onLeaf,sz*.9,Math.round(n*.4),[.93,.56,.3],1,.05));
  ev.push(dabs(t+5,1.2,'Autumn: red',onLeaf,sz*.85,Math.round(n*.25),[.78,.33,.28],1,.05));
  if(gArea>I.n*.003)ev.push(dabs(t+6.4,1.4,'Autumn: falling leaves',i=>Pt.ground[i]>.4,sz*.55,Math.round(gArea/(sz*sz)*.5),[.9,.58,.3],1,.04));
  // winter
  ev.push(blot(t+8.6,1.6,'Winter: the leaves come down',i=>Math.max(leaf(i),Pt.ground[i]*.8),.85));
  ev.push({t:t+10.4,dur:1.6,label:'Winter: bare branches',make:()=>{},onStart:()=>inkJob(Pt.branches,1.6,'#4a3528',1.1,2)});
  ev.push(blot(t+12.2,1.2,'Winter: snow settles',i=>Pt.tops[i]*I.Fu[i],.92));
  ev.push({...glaze(t+13.6,1.4,'Winter: a cold light',i=>I.Fu[i]*(1-Pt.tops[i]),[.88,.9,.97],.8,.1),onStart:()=>{snowOn=true;}});
  // spring
  ev.push({...dabs(t+15.6,1.4,'Spring: new green',onLeaf,sz*.9,Math.round(n*.55),[.74,.87,.46],.9,.06),onStart:()=>{snowOn=false;}});
  ev.push(dabs(t+17.2,1.2,'Spring: blossom',onLeaf,sz*.45,Math.round(n*.35),[.97,.77,.82],1,.04));
  // summer
  ev.push(dabs(t+18.8,1.4,'Summer: deep greens',onLeaf,sz,Math.round(n*.55),[.42,.63,.38],1,.06));
  ev.push(dabs(t+20.4,1.2,'Summer: shade under the leaves',i=>onLeaf(i)&&I.L[i]<I.Lmid[i]-2,sz*.8,Math.round(n*.3),[.3,.5,.36],1,.05));
  runExtra(ev);
}

// One more pass of small marks laid over the dry painting. Each press looks at finer contrast and
// reaches a little further out from the focus.
let extraPasses=0;
function detailEvent(k,t0){
  const I=IM,lo=Math.max(1.2,3-k*.6),hi=Math.max(5,10-k*1.5),reach=Math.min(.9,.35+k*.2);
  return {t:t0,dur:1.4,label:k?'Adding finer detail':'Adding detail',make:()=>fieldFrom(i=>{
    const d=smooth(lo,hi,I.Lfine[i]-I.L[i])*smooth(80,20,I.L[i]);
    const extra=Math.max(0,I.Ar[i]-I.Br[i])+Math.max(0,I.Ag[i]-I.Bg[i])+Math.max(0,I.Ab[i]-I.Bb[i]);
    const m=Math.max(d,smooth(.05,.25,extra)*.8)*Math.max(I.Fg[i]*lerp(reach,1,I.Fa[i]),0)*(1-I.HL[i]*.7);if(m<.04)return 0;
    return [.32*I.Ar[i]*m,.32*I.Ag[i]*m,.32*I.Ab[i]*m,.025*m];})};
}
function detailPass(){
  fast=false;const t0=simT+.3,ev=detailEvent(extraPasses++,t0);
  events.push(ev);passStart=simT;endT=Math.max(endT,t0+ev.dur+2.2);setState('painting');
}

// ---------- ink ----------
const inkCv=document.getElementById('ink'),ictx=inkCv.getContext('2d');
let inkOn=false,inkLines=[],inkDrawn=0,inkStart=null;
function prepareInk(){
  const I=IM,fx=I.focus.x*I.gw,fy=I.focus.y*I.gh,toCss=([x,y])=>[GOX+(I.gx0+x+.5)/S,GOY+(I.gy0+y+.5)/S];
  const pieces=[];
  for(const l of I.lines){let cur=[];const flush=()=>{if(cur.length>=5)pieces.push(cur);cur=[];};
    for(const [x,y] of l){const i=Math.round(y)*I.gw+Math.round(x);if(I.Fg[i]>.5&&(IW()||I.HL[i]<.6))cur.push([x,y]);else flush();}flush();}
  inkLines=pieces.filter(l=>{const [x,y]=l[Math.floor(l.length/2)],i=Math.round(y)*I.gw+Math.round(x);return (IW()?I.Fg:I.Fa)[i]>.2&&!(IW()&&I.leaf[i]>.4);})
    .map(l=>IW()?{pts:l.map(toCss),d:Math.hypot(l[0][0]-fx,l[0][1]-fy),a:rnd(.7,.9),w:rnd(.75,1.1),c:'#6b4430'}:{pts:l.map(toCss),d:Math.hypot(l[0][0]-fx,l[0][1]-fy),a:rnd(.5,.85),w:rnd(.7,1.25),c:'#3a2e27'})
    .sort((a,b)=>a.d-b.d);
  inkDrawn=0;
}
function drawInkUpTo(k){
  const dpr=inkCv.width/W;ictx.setTransform(dpr,0,0,dpr,0,0);ictx.lineCap=ictx.lineJoin='round';ictx.strokeStyle='#3a2e27';
  for(;inkDrawn<k&&inkDrawn<inkLines.length;inkDrawn++){const L=inkLines[inkDrawn];
    ictx.globalAlpha=L.a;ictx.lineWidth=L.w;ictx.strokeStyle=L.c;ictx.beginPath();
    L.pts.forEach(([x,y],i)=>{const j=IW()?.15:.35,jx=x+rnd(-j,j),jy=y+rnd(-j,j);i?ictx.lineTo(jx,jy):ictx.moveTo(jx,jy);});
    ictx.stroke();}
}
let inkJobs=[];
function inkJob(lines,dur,color,wLo,wHi){const I=IM,toCss=([x,y])=>[GOX+(I.gx0+x+.5)/S,GOY+(I.gy0+y+.5)/S];
  inkJobs.push({lines:lines.map(l=>Array.isArray(l)?{pts:l.map(toCss),w:rnd(wLo,wHi),a:rnd(.7,.9)}:{pts:l.pts.map(toCss),w:clamp(l.w/S,.6,6),a:.85}),start:simT,dur,done:0,color});}
function runInkJobs(){
  const dpr=inkCv.width/W;ictx.setTransform(dpr,0,0,dpr,0,0);ictx.lineCap=ictx.lineJoin='round';

<script>

// An original dusk scene composed in code, painted by the engine above, then brought to life.

function archPath(g,x0,x1,top,bottom){ // a cusped (multifoil) arch

// ================= the musician =================

function paintSprite(drawFn,[x0,y0,bw,bh]){
  const k=IM.rect.w/SW0,dpr=Math.min(2,devicePixelRatio||1),gs=k*dpr*1.6,gw=Math.ceil(bw*gs),gh=Math.ceil(bh*gs),n=gw*gh;
  const ow=Math.ceil(bw*k*dpr),oh=Math.ceil(bh*k*dpr);
  const L=document.createElement('canvas');L.width=gw;L.height=gh;const lg=L.getContext('2d',{willReadFrequently:true});
  lg.scale(gw/bw,gh/bh);lg.translate(-x0,-y0);drawFn(lg);
  const d=lg.getImageData(0,0,gw,gh).data,al=new Float32Array(n),Ar=new Float32Array(n),Ag=new Float32Array(n),Ab=new Float32Array(n);
  for(let i=0;i<n;i++){const a=d[i*4+3]/255;al[i]=a;if(!a)continue;let r=d[i*4]/255,g=d[i*4+1]/255,b=d[i*4+2]/255;const y=.3*r+.59*g+.11*b;
    r=clamp(y+(r-y)*1.2,0,1);g=clamp(y+(g-y)*1.2,0,1);b=clamp(y+(b-y)*1.2,0,1);
    const A=[r,g,b].map((v,c)=>-Math.log(clamp(v/PAPER[c],.04,1))/DENSITY),mx=Math.max(...A,1e-4),kk=2.2*Math.tanh(mx/2.2)*.95/mx;
    Ar[i]=A[0]*kk;Ag[i]=A[1]*kk;Ab[i]=A[2]*kk;}
  const Br=boxBlur(Ar,gw,gh,1),Bg=boxBlur(Ag,gw,gh,1),Bb=boxBlur(Ab,gw,gh,1);
  const field=fn=>{const f=new Float32Array(n*4);for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const i=y*gw+x,v=fn(i);if(!v)continue;const j=((gh-1-y)*gw+x)*4;f.set(v,j);}const t=tex(gw,gh,true,f);return t;};
  const base=field(i=>al[i]>.01?[.6*Br[i]*al[i],.6*Bg[i]*al[i],.6*Bb[i]*al[i],.11*al[i]]:0);
  const det=field(i=>al[i]>.01?[Math.max(0,Ar[i]-.45*Br[i])*al[i],Math.max(0,Ag[i]-.45*Bg[i])*al[i],Math.max(0,Ab[i]-.45*Bb[i])*al[i],.02*al[i]]:0);
  const w=pair(gw,gh),g=pair(gw,gh),dd=pair(gw,gh),Z={i:[gw,gh]},mine=[w.a,w.b,g.a,g.b,dd.a,dd.b];
  gl.clearColor(0,0,0,0);for(const t of mine){gl.bindFramebuffer(gl.FRAMEBUFFER,fbo([t]));gl.clear(gl.COLOR_BUFFER_BIT);}
  const run=m=>{for(let i=0;i<m;i++){draw(FLOW,{sz:Z,W:w.a,G:g.a,P:paper,...P},[w.b,g.b],gw,gh);w.swap();g.swap();
    draw(SETTLE,{sz:Z,W:w.a,G:g.a,D:dd.a,P:paper,...P},[g.b,dd.b],gw,gh);g.swap();dd.swap();}};
  const lay2=F=>{draw(SPLATF,{sz:Z,W:w.a,G:g.a,F,P:paper},[w.b,g.b],gw,gh);w.swap();g.swap();};
  lay2(base);run(70);lay2(det);run(260);
  const out=tex(ow,oh,false);out.id=++tid;
  draw(SHOW,{sz:Z,W:w.a,G:g.a,D:dd.a,P:paper,map:[gw/ow,-.5,gh/oh,-.5],density:DENSITY,dpr:ow/(bw*k)},[out],ow,oh);
  const px=new Uint8Array(ow*oh*4);gl.readPixels(0,0,ow,oh,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const ids=new Set([...mine,out].map(t=>t.id));
  for(const [kk2,f] of [...fbos])if(kk2.split(',').some(i=>ids.has(+i))){gl.deleteFramebuffer(f);fbos.delete(kk2);}
  for(const t of [...mine,out,base,det])gl.deleteTexture(t);
  const C=document.createElement('canvas');C.width=ow;C.height=oh;const cg=C.getContext('2d'),im=cg.createImageData(ow,oh);
  for(let y=0;y<oh;y++)im.data.set(px.subarray((oh-1-y)*ow*4,(oh-y)*ow*4),y*ow*4);cg.putImageData(im,0,0);
  cg.globalCompositeOperation='destination-in';cg.imageSmoothingQuality='high';cg.drawImage(L,0,0,ow,oh);
  return {img:C,x:x0,y:y0,w:bw,h:bh};
}
// frames for each part; the first frames are made before the scene is painted, the rest after
const FR={body:[],arm:[],head:[],scarf:[]};let jobs=[],framesReady=false,figMask=null;
function firstFrames(){for(const k in PARTS)FR[k][0]=paintSprite(g=>PARTS[k].draw(g,0),PARTS[k].box);}
function queueFrames(){jobs=[];for(const k of ['arm','head','scarf'])for(const f of ORDER.slice(1))jobs.push({k,f,role:ROLE[ORDER.indexOf(f)]});}
function makeFigMask(){figMask=document.createElement('canvas');figMask.width=SW0;figMask.height=1100;const g=figMask.getContext('2d');
  drawScarf(g,0);drawBody(g);drawHead(g,0);drawArm(g,0,0);}
// a filmstrip of the plucking hand: you watch the frames being made, in the animator's order
const strip=document.createElement('div');strip.className='strip';document.body.appendChild(strip);
const slots=ORDER.map(()=>null);
function buildStrip(){strip.innerHTML='';for(let f=0;f<9;f++){const d=document.createElement('div');d.className='slot';d.innerHTML=`<canvas></canvas><span>${f+1}</span>`;strip.appendChild(d);slots[f]=d;}}
function fillSlot(f,spr,role){const d=slots[f];if(!d)return;const c=d.querySelector('canvas'),h=72,w=Math.round(h*spr.w/spr.h);c.width=w*2;c.height=h*2;c.style.width=w+'px';c.style.height=h+'px';
  const g=c.getContext('2d');g.fillStyle='#fbf8f1';g.fillRect(0,0,c.width,c.height);g.drawImage(spr.img,0,0,c.width,c.height);d.classList.add('in');d.querySelector('span').textContent=role;}
// playback
let headP=0,headDir=1,armF=0,armHold=1,scarfP=0;
function drawSprite(spr,a){if(!spr)return;ac.globalAlpha=a;ac.drawImage(spr.img,spr.x,spr.y,spr.w,spr.h);}
function figureFrame(dt,a){
  if(framesReady){
    headP+=dt*2.4*headDir;if(headP>8){headP=8;headDir=-1;}if(headP<0){headP=0;headDir=1;}
    if(armHold>0){armHold-=dt;}else{const before=armF;armF+=dt*13;if(before<4&&armF>=4)for(let q=0;q<3;q++){const [x,y]=neckAt(rnd(.1,.35));petals.push({x,y,vx:rnd(10,50),vy:rnd(-55,-20),a:rnd(0,7),va:rnd(-2,2),s:rnd(7,12),age:0,life:rnd(6,10)});}
      if(armF>=8){armF=0;armHold=rnd(.25,1.1);}}
    scarfP=(scarfP+dt*5)%9;
  }
  drawSprite(FR.scarf[framesReady?Math.floor(scarfP):0],a);
  drawSprite(FR.body[0],a);
  drawSprite(FR.head[framesReady?Math.round(headP):0],a);
  drawSprite(FR.arm[framesReady?Math.floor(armF):0],a);
}

// ---------- start ----------
document.title='Pavilion';
const hdr=document.createElement('div');hdr.className='ptitle';hdr.innerHTML='Pavilion <i>painted, then brought to life</i>';document.body.appendChild(hdr);
const again=document.createElement('button');again.className='btn pagain';again.textContent='Paint it again';again.onclick=()=>{alive=0;T=0;petals=[];sparks=[];ripples=[];startPainting();};document.body.appendChild(again);
const st=document.createElement('style');st.textContent=`.ptitle{position:fixed;left:20px;top:16px;font-size:17px;font-weight:500;z-index:3}.ptitle i{font-weight:400;opacity:.6}
  .pagain{position:fixed;right:18px;top:12px;z-index:3;display:none}.done .pagain{display:block}
  .strip{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:3;transition:opacity 1s}
  .strip.gone{opacity:0;pointer-events:none}
  .slot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:44px;opacity:.25;transition:opacity .4s}
  .slot.in{opacity:1}.slot canvas{border-radius:3px;box-shadow:0 0 0 1px rgba(90,70,40,.15);background:#fbf8f1;height:72px;min-width:40px}
  .slot span{font-size:10px;opacity:.7;white-space:nowrap}`;document.head.appendChild(st);
sizeAnim();addEventListener('resize',()=>setTimeout(sizeAnim,300));
{const scene=makeScene();analyse(scene);makeFigMask();firstFrames();startPainting();
  if(Q.has('t')){fast=true;advance(Math.round(+Q.get('t')*STEPS_PER_SEC));if(!events.length)setState('done');
    if(Q.get('live')){alive=1;T=+Q.get('live');}}}
</script>
