  .tool{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;background:#fbf8f1;box-shadow:inset 0 0 0 1px rgba(60,40,20,.15);display:grid;place-items:center}
  .tool.on{outline:2px solid #4d4238;outline-offset:2px}

<body>
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="sh" aria-hidden="true"></canvas>
<canvas id="ov" aria-label="A watercolour meadow. Draw a loop on the grass to make a sheep."></canvas>
<canvas id="title" role="img" aria-label="Meadow"></canvas>
<div class="count" id="count"></div>
<div class="hint" id="hint">Draw a loop on the grass and it becomes a sheep. Tap one to say hi.</div>
<div class="bar" id="bar"></div>
<div class="err" id="err"></div>
<script src="sounds/sounds.js"></script>
<script>
// A small Curtis-style watercolour simulation (Curtis et al. 1997, simplified, on the GPU).
// Each paper cell holds water, pigment floating in the water, and pigment settled into the paper.
// Water flows between wet cells and creeps slowly into dry paper; pigment rides the flow.
// The rim of a wash dries first, so water keeps flowing outward and carries pigment to the edge.
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false});
function fail(m){const e=document.getElementById('err');e.style.display='grid';e.textContent=m;throw new Error(m);}
if(!gl)fail('This needs WebGL2, which this browser does not have.');
if(!gl.getExtension('EXT_color_buffer_float'))fail('This browser cannot render to float textures, which the paint simulation needs.');

const Q=new URLSearchParams(location.search);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];

const TAU=Math.PI*2;
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
let DPR=1,horizon=0,PA={x0:0,x1:1,y1:1};
// ---------- noise + paper textures ----------
const perm=Array.from({length:512},()=>Math.random());
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return perm[i&511]*(1-u)+perm[(i+1)&511]*u;}
function tileNoise(n,cells,oct){ // tileable value noise, 0..1
  const out=new Float32Array(n*n);let amp=1,tot=0;
  for(let o=0;o<oct;o++){
    const c=cells<<o,grid=Float32Array.from({length:c*c},()=>Math.random());
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      const gx=x/n*c,gy=y/n*c,x0=Math.floor(gx),y0=Math.floor(gy),fx=gx-x0,fy=gy-y0;
      const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy),x1=(x0+1)%c,y1=(y0+1)%c;
      const v=lerp(lerp(grid[y0*c+x0],grid[y0*c+x1],ux),lerp(grid[y1*c+x0],grid[y1*c+x1],ux),uy);
      out[y*n+x]+=v*amp;}
    tot+=amp;amp*=.5;}
  for(let i=0;i<out.length;i++)out[i]/=tot;return out;
}
const TN=256;
function texture(fn){const c=mk(TN,TN),g=c.getContext('2d'),im=g.createImageData(TN,TN);
  for(let i=0;i<TN*TN;i++){im.data[i*4]=150;im.data[i*4+1]=140;im.data[i*4+2]=124;im.data[i*4+3]=clamp(fn(i),0,1)*255;}
  g.putImageData(im,0,0);return c;}
const fineN=tileNoise(TN,64,2),lowN=tileNoise(TN,4,4);
const GRAIN=texture(i=>(Math.random()*.5+fineN[i]*.7-.55)*2.4);   // paper tooth: where pigment skips
const MOTTLE=texture(i=>(lowN[i]-.42)*2.6);                        // slow blotches: where pigment pools
function pat(g,img,scale){const p=g.createPattern(img,'repeat');
  try{p.setTransform(new DOMMatrix().translateSelf(rnd(0,TN*scale),rnd(0,TN*scale)).scaleSelf(scale));}catch(e){}return p;}

function polyPath(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const p of pts)c.lineTo(p[0],p[1]);c.closePath();}
function circle(x,y,rx,ry,n){const p=[];for(let i=0;i<n;i++){const a=i/n*TAU;p.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry]);}return p;}
// ---------- voice: a formant bleat ----------
// A glottal buzz through three "aa" formants. The lips open from "m" into "aa" and close toward "eh";
// one slow wobble drives both pitch vibrato and the amplitude quaver, which is what makes it a sheep.
let AU=null;
function audio(){
  if(!AU){try{
    const a=new (window.AudioContext||window.webkitAudioContext)();
    const out=a.createDynamicsCompressor();out.threshold.value=-16;out.knee.value=12;out.ratio.value=3;out.connect(a.destination);
    const master=a.createGain();master.connect(out);MASTER=master;const dry=a.createGain();dry.gain.value=.9;dry.connect(master);
    const rev=a.createConvolver(),n=a.sampleRate*1.8,ib=a.createBuffer(2,n,a.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<n;i++)d[i]=i<a.sampleRate*.015?0:(Math.random()*2-1)*Math.pow(1-i/n,2.6);}
    rev.buffer=ib;const wet=a.createGain();wet.gain.value=.12;rev.connect(wet);wet.connect(master);
    const nb=a.createBuffer(1,a.sampleRate*2,a.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    AU={a,dry,rev,noise:nb};
  }catch(e){return null;}}
  if(AU.a.state==='suspended')AU.a.resume();
  return AU;
}
// Real recordings: decoded once, each with a loudness envelope so the mouth can follow it.
let CLIPS=null,FIELD=null,LAST=null,fieldOn=false,muted=false,MASTER=null;
async function loadClips(){
  if(CLIPS||!window.SHEEP_SOUNDS)return;CLIPS=[];
  // decode offline: works before the first click, and the buffers play fine in the live context
  const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext,off=new OC(1,1,44100);
  const dec=b64=>new Promise((ok,no)=>{const p=off.decodeAudioData(Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0)).buffer,ok,no);if(p&&p.catch)p.catch(no);});
  for(const b of SHEEP_SOUNDS.bleats){try{const buf=await dec(b),d=buf.getChannelData(0),hop=Math.round(buf.sampleRate*.02),env=[];
    for(let i=0;i+hop<=d.length;i+=hop){let e=0;for(let k=i;k<i+hop;k++)e+=d[k]*d[k];env.push(Math.sqrt(e/hop));}
    const mx=Math.max(...env)||1;CLIPS.push({buf,env:env.map(e=>e/mx)});}catch(e){}}
  try{FIELD=await dec(SHEEP_SOUNDS.field);}catch(e){}
}
function startField(){ // the field the recordings came from, very quietly underneath
  const A=audio();if(fieldOn||!A||!FIELD)return;fieldOn=true;
  const src=A.a.createBufferSource(),g=A.a.createGain();src.buffer=FIELD;src.loop=true;g.gain.value=0;
  g.gain.linearRampToValueAtTime(.16,A.a.currentTime+3);src.connect(g);g.connect(A.dry);src.start();
}
function bleat(v,vol=1,pan=0){
  const A=audio();if(!A)return 0;
  if(CLIPS&&CLIPS.length&&v.clip!=null){
    const c=CLIPS[v.clip%CLIPS.length],a=A.a,r=v.prate*(v.lamb?1.12:1)*rnd(.97,1.03);
    const src=a.createBufferSource(),g=a.createGain();src.buffer=c.buf;src.playbackRate.value=r;g.gain.value=.9*vol;
    src.connect(g);let tail=g;
    if(a.createStereoPanner){const p=a.createStereoPanner();p.pan.value=clamp(pan,-.8,.8);g.connect(p);tail=p;}
    tail.connect(A.dry);tail.connect(A.rev);src.start();
    const dur=c.buf.duration/r;LAST={env:c.env,rate:r,dur};return dur;
  }
  LAST=null;
  const a=A.a,t=a.currentTime+.02,dur=v.dur*rnd(.9,1.1),f=v.f0*rnd(.96,1.04),fs=v.fs,end=t+dur;
  const o1=a.createOscillator(),o2=a.createOscillator();o1.type=o2.type='sawtooth';o2.detune.value=rnd(8,16);
  for(const o of [o1,o2]){o.frequency.setValueAtTime(f*.8,t);o.frequency.exponentialRampToValueAtTime(f*1.05,t+.07);
    o.frequency.exponentialRampToValueAtTime(f,t+.22);o.frequency.exponentialRampToValueAtTime(f*v.fall,end);}
  const lfo=a.createOscillator();lfo.frequency.setValueAtTime(v.rate*.85,t);lfo.frequency.linearRampToValueAtTime(v.rate*1.1,end);
  const vib=a.createGain();vib.gain.setValueAtTime(f*.012,t);vib.gain.linearRampToValueAtTime(f*.045,end);
  lfo.connect(vib);vib.connect(o1.frequency);vib.connect(o2.frequency);
  const src=a.createGain();src.gain.value=.5;o1.connect(src);o2.connect(src);
  const nz=a.createBufferSource();nz.buffer=A.noise;nz.loop=true;
  const nzf=a.createBiquadFilter();nzf.type='highpass';nzf.frequency.value=900;
  const nzg=a.createGain();nzg.gain.value=v.breath;nz.connect(nzf);nzf.connect(nzg);nzg.connect(src);
  const lip=a.createBiquadFilter();lip.type='lowpass';lip.Q.value=.7;
  lip.frequency.setValueAtTime(500,t);lip.frequency.exponentialRampToValueAtTime(4200,t+.07);
  lip.frequency.setValueAtTime(4200,end-.15);lip.frequency.exponentialRampToValueAtTime(1500,end);
  src.connect(lip);
  const form=a.createGain();
  for(const [fq,Q,gain] of [[[380,780,560],6,2.2],[[1100,1300,1550],8,1.3],[[2450,2650,2550],10,.6]]){
    const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=Q;
    bp.frequency.setValueAtTime(fq[0]*fs,t);bp.frequency.exponentialRampToValueAtTime(fq[1]*fs,t+.08);
    bp.frequency.setValueAtTime(fq[1]*fs,end-dur*.35);bp.frequency.exponentialRampToValueAtTime(fq[2]*fs,end);
    const g=a.createGain();g.gain.value=gain;lip.connect(bp);bp.connect(g);g.connect(form);}
  const nasal=a.createBiquadFilter();nasal.type='lowpass';nasal.frequency.value=900;
  const ng=a.createGain();ng.gain.value=.35;lip.connect(nasal);nasal.connect(ng);ng.connect(form);
  const trem=a.createGain();trem.gain.value=.7;
  const td=a.createGain();td.gain.setValueAtTime(.12,t);td.gain.linearRampToValueAtTime(.4,end);lfo.connect(td);td.connect(trem.gain);
  form.connect(trem);
  const env=a.createGain(),pk=.3*vol;
  env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+.035);env.gain.setValueAtTime(pk,t+.06);
  env.gain.linearRampToValueAtTime(pk*.8,end-.12);env.gain.exponentialRampToValueAtTime(.0008,end+.06);
  trem.connect(env);
  let tail=env;
  if(a.createStereoPanner){const p=a.createStereoPanner();p.pan.value=clamp(pan,-.8,.8);env.connect(p);tail=p;}
  tail.connect(A.dry);tail.connect(A.rev);
  for(const n of [o1,o2,lfo,nz]){n.start(t);n.stop(end+.12);}
  return dur;
}

// ---------- sheep ----------
const FACES={
  black:  {rim:'#140f0d',skin:'#2f2622',ink:'#120d0b',white:'#f4ecdd',ear:'#b98478',blush:'#a25a56',blushA:.4,soft:'#d8c8b2'},
  cream:  {rim:'#d8bf9f',skin:'#f1e4d0',ink:'#6d5a49',white:'#fffbf2',ear:'#efb0a3',blush:'#f39587',blushA:.38,soft:'#4a3a2e'},
  brown:  {rim:'#634634',skin:'#8c6b54',ink:'#3b2b21',white:'#fbf3e4',ear:'#dc9d8e',blush:'#d27b6c',blushA:.38,soft:'#2a1d16'},
  speckle:{rim:'#cfb796',skin:'#ece0cc',ink:'#5e4c3d',white:'#fffbf2',ear:'#efb0a3',blush:'#f39587',blushA:.38,soft:'#4a3a2e',spots:true},
};
const TINTS=['#fbf8f1','#f7f0e3','#f3eadb','#fffdf8'];
const DARK_WOOL='#4f4540',DARK_INK='#2b231f',WOOL_INK='#76685b';
const sheep=[];
let ptr=null;
function area(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];
  if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function ell(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.001,rx),Math.max(.001,ry),rot,0,TAU);c.fill();}
// a little wash: flat colour that dried darker at its edge
function washEll(c,x,y,rx,ry,rot,fill,rim){c.fillStyle=fill;ell(c,x,y,rx,ry,rot);
  c.save();c.beginPath();c.ellipse(x,y,rx,ry,rot,0,TAU);c.clip();c.globalAlpha=.45;c.strokeStyle=rim;c.lineWidth=Math.min(rx,ry)*.35;c.stroke();c.restore();}

class Sheep{
  constructor(shape,x,y,size,o={}){
    if(area(shape)<0)shape.reverse(); // same winding as the puffs, so the wool clips as one shape
    this.shape=shape;this.x=x;this.y=y;this.size=size;
    this.dir=Math.random()<.5?-1:1;this.face=this.dir;
    this.born=performance.now();this.phase=Math.random()*10;this.phase0=Math.random()*10;
    this.state='idle';this.t=rnd(1,2.5);this.tx=x;this.ty=y;this.speed=rnd(18,30);
    this.hop=0;this.baa=0;this.talk=0;this.g=0;this.n=0;this.napCool=8;
    this.blink=0;this.blinkT=rnd(1,4);this.earFlick=0;this.earT=rnd(2,6);
    this.lx=0;this.ly=0;this.wx=0;this.wy=0;this.wT=0;
    this.dark=o.dark??Math.random()<.12;
    this.tint=pick(TINTS);
    this.faceKey=o.face??(this.dark?'black':pick(['black','black','cream','cream','cream','brown','speckle','speckle']));
    let top=0,bottom=0,left=0,right=0,ri=0;
    shape.forEach((p,i)=>{top=Math.min(top,p[1]);bottom=Math.max(bottom,p[1]);left=Math.min(left,p[0]);if(p[0]>right){right=p[0];ri=i;}});
    Object.assign(this,{top,bottom,left,right});
    this.headScale=1.5;this.hx=right*.86+.06;this.hy=Math.min(shape[ri][1],.1)*.5-.3;
    this.topknot=[[-.1,-.16,.08],[-.01,-.215,.09],[.09,-.19,.075],[-.155,-.08,.06]].map(([x,y,r])=>[x+rnd(-.015,.015),y+rnd(-.015,.015),r*rnd(.9,1.1)]);
    this.spots=Array.from({length:5},()=>[rnd(-.14,.12),rnd(-.1,.12),rnd(.012,.026)]);
    this.voice={f0:clamp(600-size*3.4,240,540)*rnd(.92,1.08)*(this.dark?.9:1),rate:rnd(7.5,11),dur:rnd(.5,.85),
      fall:rnd(.82,.95),fs:clamp(1.28-size/220,1,1.22),breath:rnd(.05,.12),
      clip:Math.floor(Math.random()*8),prate:clamp(1.32-size/160,.82,1.3)*(this.dark?.92:1)};
    this.puffs=this.makePuffs();this.body=this.makeBody();this.head=this.makeHead();this.earImg=this.makeEar();
  }
  makePuffs(){
    const S=this.shape,n=S.length;let per=0;
    for(let i=0;i<n;i++){const a=S[i],b=S[(i+1)%n];per+=Math.hypot(b[0]-a[0],b[1]-a[1]);}
    const count=clamp(Math.round(per/.2),12,44),P=[];
    for(let k=0;k<count;k++){const p=S[Math.floor(k*n/count)];P.push([p[0]*.86,p[1]*.86,rnd(.17,.24),rnd(.028,.045)]);}
    return P;
  }
  // The fleece is painted once: ink-edged scallops, a cool shadow wash, curls, and paper grain.
  // The fleece is painted, not drawn: clear water over the body, a cool shadow dropped into the
  // underside and the lower edge of each lump, left to run and dry. The wool itself is bare paper.
  makeBody(){
    const E=1.55,K=this.size*1.2*DPR,cw=Math.ceil(2*E*K),P=this.puffs;
    const gw=Math.max(32,Math.ceil(2*E*this.size*1.2*S)),U=gw/(2*E),o=gw/2;
    const poly=this.shape.map(p=>[p[0]*.86,p[1]*.86]);
    const body=(g,u,c,grow=0)=>{g.beginPath();for(const [x,y,r] of P){g.moveTo(x*u+c+(r+grow)*u,y*u+c);g.arc(x*u+c,y*u+c,(r+grow)*u,0,TAU);}
      g.moveTo(poly[0][0]*u+c,poly[0][1]*u+c);for(const q of poly)g.lineTo(q[0]*u+c,q[1]*u+c);g.closePath();};
    const inBody=g=>{body(g,U,o);g.fill();};
    const under=g=>{inBody(g);g.globalCompositeOperation='destination-in';
      const gr=g.createLinearGradient(0,(this.bottom+.1)*U+o,0,this.top*U+o);
      for(const [st,al] of [[0,1],[.22,.6],[.45,.18],[.65,.03],[1,0]])gr.addColorStop(st,`rgba(255,255,255,${al})`);
      g.fillStyle=gr;g.fillRect(0,0,gw,gw);g.globalCompositeOperation='source-over';};
    const lumps=g=>{inBody(g);g.globalCompositeOperation='destination-in';g.strokeStyle='#fff';g.lineCap='round';
      for(const [x,y,r] of P){g.lineWidth=r*U*.35;g.beginPath();g.arc(x*U+o,y*U+o,r*U*.7,.2*Math.PI,.8*Math.PI);g.stroke();}
      g.globalCompositeOperation='source-over';};
    const washes=this.dark
      ?[[inBody,'wooldark',.22,1,20],[under,'wooldark',.02,.6,0],[lumps,'wooldark',.015,.4,0]]
      :[[inBody,'water',.22,0,20],[under,'shade',.02,.6,0],[lumps,'shade',.015,.35,0]];
    const c=paintSheet(gw,gw,cw,cw,washes,650),g=c.getContext('2d');
    g.globalCompositeOperation='destination-in';body(g,K,cw/2,.012);g.fill();g.globalCompositeOperation='source-over';
    // ink: only the outer scallops, in broken runs of varying weight
    g.translate(cw/2,cw/2);g.scale(K,K);g.lineCap='round';g.lineJoin='round';
    const ink=this.dark?'rgba(38,30,26,.85)':'rgba(96,82,70,.78)',shrunk=poly.map(q=>[q[0]*.97,q[1]*.97]);
    const covered=(x,y,skip)=>{for(let j=0;j<P.length;j++){if(j===skip)continue;const [px,py,pr]=P[j];if(Math.hypot(x-px,y-py)<pr*.97)return true;}return inPoly(x,y,shrunk);};
    g.strokeStyle=ink;
    const flush=run=>{if(run.length<2||Math.random()<.12)return;g.lineWidth=.028*rnd(.6,1.35);g.beginPath();run.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();};

    [20,()=>wash(g=>{ // trees on the ridge
      for(let k=0;k<3;k++){const gx=rnd(X0+u*.1,X1-u*.1);
        for(let i=0;i<2+Math.floor(Math.random()*3);i++){const x=gx+rnd(-u*.05,u*.05),ri=Math.floor((x-nearR[0][0])/8);
          const y=(nearR[clamp(ri,0,nearR.length-1)]||[0,HZ])[1]+u*.01,s=u*rnd(.012,.022),tall=Math.random()<.5?rnd(1.8,2.6):1.1;
          g.beginPath();g.ellipse(x,y-s*tall,s,s*tall,0,0,7);g.fill();}}},'dark',.14,.9)],
  ]).map(([t,f])=>[t*TS,f]);
}

// ---------- running it ----------
let script=[],simT=0,pending=[];
let intro=false,chunk=240;
function restart(){clearAll();simT=0;script=meadowScript();intro=true;}
function advance(nSteps){
  for(let i=0;i<nSteps;i++){
    while(script.length&&script[0][0]<=simT)script.shift()[1]();
    step();simT+=1/STEPS_PER_SEC;
  }
}
// ---------- the sheep layer ----------
const ov=document.getElementById('ov'),octx=ov.getContext('2d'),shc=document.getElementById('sh'),shctx=shc.getContext('2d');
let tool='sheep',drawing=false,stroke=[],fading=[],painting=false,last=null;

// A new sheep soaks into the paper first: clear water inside the loop pushes the paint out into a ring.
function wetBlot(pts){
  useMask(g=>{g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x*S,y*S):g.moveTo(x*S,y*S));g.closePath();g.fill();});
  splat({useM:{i:[1]},pig:PIG.water,water:.14,conc:0});
}
function spawn(shape,x,y,size,o,pts,quiet){
  wetBlot(pts);
  const s=new Sheep(shape,x,y,size,o);sheep.push(s);
  if(!quiet){const v={...s.voice,f0:s.voice.f0*1.12,dur:s.voice.dur*.8,lamb:true},d=bleat(v,.9,(x/W*2-1)*.6)||v.dur;
    s._env=LAST;s._talkDur=d;s.talk=d;s.baa=1.8;s.word='b'+'a'.repeat(clamp(Math.round(d*6),2,5));}
}
function starter(fx,fy,sz,face){
  const shape=circle(0,0,1,.72,64).map(p=>[p[0]+rnd(-.05,.05),p[1]+rnd(-.05,.05)]);
  const x=lerp(PA.x0+40,PA.x1-40,fx),y=lerp(horizon+50,PA.y1-15,fy),s=sz*(.55+.6*((y-horizon)/(H-horizon))),by=y-s*1.14;
  spawn(shape,x,y,sz,{face,dark:false},shape.map(([a,b])=>[x+a*s*1.05,by+b*s*1.05]),true);
}
function finish(pts){
  const [ex,ey]=pts[0];let len=0;
  for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  if(len<25){const hit=[...sheep].sort((a,b)=>b.y-a.y).find(s=>s.hit(ex,ey));if(hit){hit.wake();hit.hop=1;hit.say(1);}return;}
  let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=pts.length;cy/=pts.length;
  let maxR=0,maxY=-1e9;pts.forEach(p=>{maxR=Math.max(maxR,Math.hypot(p[0]-cx,p[1]-cy));maxY=Math.max(maxY,p[1]);});
  if(maxR<10)return;
  const shape=resample(pts,64).map(p=>[(p[0]-cx)/maxR,(p[1]-cy)/maxR]);
  const groundY=clamp(maxY+maxR*.35,horizon+50,PA.y1-15),size=clamp(maxR/(.55+.6*((groundY-horizon)/(H-horizon))),14,120);
  fading.push({pts:pts.slice(),t:1});
  const loop=pts.slice();setTimeout(()=>spawn(shape,clamp(cx,PA.x0+25,PA.x1-25),groundY,size,{},loop,false),180);
  document.getElementById('hint').style.opacity=0;
}
function brushDab(x,y){const r=14*S;pending.push({circ:[x*S,(H-y)*S,r],pig:PIG[tool],water:tool==='water'?.3:.22,conc:tool==='water'?0:.55});}

// toolbar: the sheep pencil, then paints
const SWATCHES=[['blue','#6aaee3'],['yellow','#f4d36a'],['lime','#c6dc72'],['green','#6ea65a'],['dark','#3a6b4c'],['orange','#ef9a4c'],['violet','#9a76c8'],['water','#e9eef2']];
const bar=document.getElementById('bar');
function choose(k,el){tool=k;bar.querySelectorAll('.sw,.tool').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
{const b=document.createElement('button');b.className='tool on';b.title='Draw a sheep';b.setAttribute('aria-label',b.title);
  b.innerHTML='<svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><g fill="#fbf8f1" stroke="#76685b" stroke-width="1.2"><circle cx="6" cy="8" r="3.4"/><circle cx="10" cy="6" r="3.6"/><circle cx="13" cy="9" r="3.4"/><circle cx="8.5" cy="10.5" r="3.4"/></g><ellipse cx="16.6" cy="8.4" rx="2.7" ry="3.1" fill="#2f2622"/><g stroke="#352b26" stroke-width="1.4" stroke-linecap="round"><path d="M7 13v3.5M12 13v3.5"/></g></svg>';
  b.onclick=()=>choose('sheep',b);bar.appendChild(b);
  const sep=document.createElement('span');sep.className='sep';bar.appendChild(sep);}
SWATCHES.forEach(([k,c])=>{const b=document.createElement('button');b.className='sw';b.style.background=k==='water'?'radial-gradient(circle at 35% 35%,#fff,#dfe7ee)':c;
  b.title=k==='water'?'Clear water':k+' paint';b.setAttribute('aria-label',b.title);b.onclick=()=>choose(k,b);bar.appendChild(b);});
function repaint(){sheep.length=0;restart();
  for(const [t,a,b,c,d] of [[16.5,.25,.35,40,'black'],[17,.6,.75,48,'cream'],[17.5,.86,.15,30,'speckle']]){const e=[t*TS,()=>starter(a,b,c,d)];e.sheep=true;script.push(e);}
  script.sort((a,b)=>a[0]-b[0]);}
for(const [label,fn] of [['Sound off',function(){muted=!muted;this.textContent=muted?'Sound on':'Sound off';const A=audio();if(A&&MASTER)MASTER.gain.setTargetAtTime(muted?0:1,A.a.currentTime,.05);startField();}],['Repaint',repaint],['Clear paint',()=>{clearAll();script=script.filter(e=>e.sheep);}]]){
  const b=document.createElement('button');b.className='t';b.textContent=label;b.onclick=fn;bar.appendChild(b);}
loadClips();
function placeHint(){document.getElementById('hint').style.bottom=(bar.getBoundingClientRect().height+Math.max(14,0)+12)+'px';}
placeHint();addEventListener('resize',placeHint);

ov.addEventListener('pointerdown',e=>{audio();startField();ov.setPointerCapture(e.pointerId);const p=[e.clientX,e.clientY];
  if(tool==='sheep'){drawing=true;stroke=[p];}else{painting=true;last=p;brushDab(...p);}});
addEventListener('pointermove',e=>{const p=[e.clientX,e.clientY];ptr={x:p[0],y:p[1],t:performance.now()};
  if(drawing){const l=stroke[stroke.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>3)stroke.push(p);}
  else if(painting){const d=Math.hypot(p[0]-last[0],p[1]-last[1]),n=Math.floor(d/5);
    for(let i=1;i<=n;i++)brushDab(lerp(last[0],p[0],i/n),lerp(last[1],p[1],i/n));if(n)last=p;}});
addEventListener('pointerup',()=>{if(drawing){drawing=false;finish(stroke);stroke=[];}painting=false;});
addEventListener('pointercancel',()=>{drawing=false;painting=false;stroke=[];});

let lastCount='';
function updateCount(){
  const z=sheep.filter(s=>s.state==='nap').length,txt=sheep.length?`${sheep.length} sheep${z?` · ${z} asleep`:''}`:'';
  if(txt!==lastCount){document.getElementById('count').textContent=txt;lastCount=txt;}
}
function sizeOverlay(){DPR=Math.min(2,devicePixelRatio||1);ov.width=shc.width=W*DPR;ov.height=shc.height=H*DPR;woolTitle();}
function drawSheep(now,dt){
  octx.setTransform(DPR,0,0,DPR,0,0);octx.clearRect(0,0,W,H);shctx.setTransform(DPR,0,0,DPR,0,0);shctx.clearRect(0,0,W,H);
  for(const s of sheep)s.update(dt,now);
  sheep.sort((a,b)=>a.y-b.y);
  for(const s of sheep)s.draw(octx,now);
  fading=fading.filter(f=>(f.t-=dt*1.6)>0);
  for(const f of fading)pencil(octx,f.pts.concat([f.pts[0]]),f.t);
  if(drawing)pencil(octx,stroke,1);
  updateCount();
}

setup();sizeOverlay();repaint();
if(document.fonts&&document.fonts.load)document.fonts.load('700 54px Fredoka').then(woolTitle,()=>{});
if(Q.has('still'))document.body.classList.add('still'); // for the share image
const skip=+(Q.get('t')||0);if(skip){P.evap=EVAP*2.2;P.evapEdge=EVAPE*2.2;advance(Math.round(skip*STEPS_PER_SEC));if(!script.length){intro=false;P.evap=EVAP;P.evapEdge=EVAPE;}}
let prev=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  for(const u of pending.splice(0))splat(u);
  if(intro){ // fast-forward: as many steps as the frame can take, adapting to this GPU
    const k=intro?2.2:1;P.evap=EVAP*k;P.evapEdge=EVAPE*k;
    advance(chunk);chunk=dt>.03?Math.max(30,chunk*.6):Math.min(600,chunk*1.25);
    if(!script.length){intro=false;P.evap=EVAP;P.evapEdge=EVAPE;}
  }else advance(Math.max(1,Math.round(dt*STEPS_PER_SEC)));
  show();drawSheep(now,dt);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{setup();sizeOverlay();repaint();},200);});
</script>
</body>
